<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting to Cortex...</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f0f0f;
      color: #e5e5e5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .icon {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      font-size: 28px;
    }
    h1 { font-size: 18px; font-weight: 600; color: #f0f0f0; margin-bottom: 8px; }
    p  { font-size: 14px; color: #888; line-height: 1.5; max-width: 300px; }
    .spinner {
      width: 20px; height: 20px;
      border: 2px solid #333;
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 20px auto 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .fallback {
      display: none;
      margin-top: 24px;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .btn {
      display: inline-block;
      padding: 10px 20px;
      background: #fff;
      color: #0f0f0f;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: none;
    }
    .btn-ghost {
      background: transparent;
      color: #888;
      border: 1px solid #2a2a2a;
      font-size: 13px;
      font-weight: 400;
    }
    .alt-fallback {
      display: none;
      margin-top: 12px;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .btn-alt {
      background: #2a2a2a;
      color: #e5e5e5;
      border: 1px solid #3a3a3a;
    }
    .hint {
      font-size: 12px;
      color: #555;
    }
    kbd {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 4px;
      border: 1px solid #3a3a3a;
      background: #1a1a1a;
      font-size: 11px;
      color: #aaa;
    }
  </style>
</head>
<body>
  <div class="icon">⚡</div>
  <h1>Redirecting to Cortex</h1>
  <p id="msg">Opening the app...</p>
  <div class="spinner" id="spinner"></div>
  <div class="fallback" id="fallback">
    <a class="btn" id="openBtn" href="#">Open Cortex</a>
    <a class="btn btn-ghost" href="https://habits.codenteam.com" id="storeLink" target="_blank">Get the app</a>
  </div>
  <div class="alt-fallback" id="devFallback">
    <a class="btn btn-alt" id="devOpenBtn" href="#">Open Cortex Dev</a>
    <p class="hint">Local <code>tauri dev</code> builds · <kbd>Ctrl</kbd>+<kbd>D</kbd></p>
  </div>
  <div class="alt-fallback" id="buildDebugFallback">
    <a class="btn btn-alt" id="buildDebugOpenBtn" href="#">Open Cortex Debug</a>
    <p class="hint"><code>pnpm build:debug</code> builds · <kbd>Ctrl</kbd>+<kbd>B</kbd></p>
  </div>

  <script>
    (function () {
      var ua = navigator.userAgent;
      var params = window.location.search;
      var hash   = window.location.hash;

      var isIOS     = /iP(hone|ad|od)/.test(ua);
      var isAndroid = /Android/.test(ua);
      var isMobile  = isIOS || isAndroid;
      var isDesktop = !isMobile;

      var deepLink = 'habits-cortex://oauth' + params + hash;
      var devDeepLink = 'habits-cortex-dev://oauth' + params + hash;
      var buildDebugDeepLink = 'habits-cortex-build-debug://oauth' + params + hash;

      var devFallback = document.getElementById('devFallback');
      var buildDebugFallback = document.getElementById('buildDebugFallback');

      function showAltFallbacks() {
        if (!isDesktop) return;
        devFallback.style.display = 'flex';
        buildDebugFallback.style.display = 'flex';
        document.getElementById('devOpenBtn').href = devDeepLink;
        document.getElementById('buildDebugOpenBtn').href = buildDebugDeepLink;
      }

      function showFallback(msg) {
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('msg').textContent = msg;
        document.getElementById('fallback').style.display = 'flex';
        document.getElementById('openBtn').href = deepLink;
        showAltFallbacks();
        if (isIOS) {
          document.getElementById('storeLink').href = 'https://apps.apple.com/app/id6741418040';
          document.getElementById('storeLink').textContent = 'Download on the App Store';
        } else if (isAndroid) {
          document.getElementById('storeLink').href = 'https://play.google.com/store/apps/details?id=com.codenteam_oss.habits';
          document.getElementById('storeLink').textContent = 'Get it on Google Play';
        } else {
          document.getElementById('storeLink').href = 'https://codenteam.com/intersect/habits/downloads.html';
          document.getElementById('storeLink').textContent = 'Download Cortex';
        }
      }

      document.getElementById('msg').textContent = 'Opening the app...';
      window.location.href = deepLink;
      setTimeout(function () {
        showFallback(isMobile ? "Cortex doesn't seem to be installed." : "Couldn't open the app automatically.");
      }, 2000);

      document.addEventListener('keydown', function (e) {
        if (!e.ctrlKey) return;
        if (e.key === 'd' || e.key === 'D') {
          e.preventDefault();
          devFallback.style.display = 'flex';
          document.getElementById('devOpenBtn').href = devDeepLink;
          return;
        }
        if (e.key === 'b' || e.key === 'B') {
          e.preventDefault();
          buildDebugFallback.style.display = 'flex';
          document.getElementById('buildDebugOpenBtn').href = buildDebugDeepLink;
        }
      });
    })();
  </script>
</body>
</html>
