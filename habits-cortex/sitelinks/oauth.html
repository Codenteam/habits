<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting to Cortex...</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f0f0f;
      color: #e5e5e5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .icon {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      font-size: 28px;
    }
    h1 { font-size: 18px; font-weight: 600; color: #f0f0f0; margin-bottom: 8px; }
    p  { font-size: 14px; color: #888; line-height: 1.5; max-width: 300px; }
    .spinner {
      width: 20px; height: 20px;
      border: 2px solid #333;
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 20px auto 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .fallback {
      display: none;
      margin-top: 24px;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .btn {
      display: inline-block;
      padding: 10px 20px;
      background: #fff;
      color: #0f0f0f;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: none;
    }
    .btn-ghost {
      background: transparent;
      color: #888;
      border: 1px solid #2a2a2a;
      font-size: 13px;
      font-weight: 400;
    }
    .status { font-size: 12px; color: #555; margin-top: 8px; }
    .dev-fallback {
      display: none;
      margin-top: 12px;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .btn-dev {
      background: #2a2a2a;
      color: #e5e5e5;
      border: 1px solid #3a3a3a;
    }
  </style>
</head>
<body>
  <div class="icon">⚡</div>
  <h1>Redirecting to Cortex</h1>
  <p id="msg">Opening the app...</p>
  <div class="spinner" id="spinner"></div>
  <div class="fallback" id="fallback">
    <a class="btn" id="openBtn" href="#">Open Cortex</a>
    <p class="status" id="statusMsg"></p>
    <a class="btn btn-ghost" href="https://habits.codenteam.com" id="storeLink" target="_blank">Get the app</a>
  </div>
  <div class="dev-fallback" id="devFallback">
    <a class="btn btn-dev" id="devOpenBtn" href="#">Open Cortex Dev</a>
    <p class="status">For local development builds only</p>
  </div>

  <script>
    (function () {
      var ua = navigator.userAgent;
      var params = window.location.search; // keep full query string, e.g. ?code=...&state=...
      var hash   = window.location.hash;   // keep hash too if present

      // Detect platform
      var isIOS     = /iP(hone|ad|od)/.test(ua);
      var isAndroid = /Android/.test(ua);
      var isMobile  = isIOS || isAndroid;
      var isDesktop = !isMobile; // Windows, macOS, Linux

      var deepLink = 'habits-cortex://oauth' + params + hash;
      var devDeepLink = 'habits-cortex-dev://oauth' + params + hash;

      function showFallback(msg) {
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('msg').textContent = msg;
        var fb = document.getElementById('fallback');
        fb.style.display = 'flex';
        document.getElementById('openBtn').href = deepLink;
        if (isIOS) {
          document.getElementById('storeLink').href = 'https://apps.apple.com/app/id6741418040';
          document.getElementById('storeLink').textContent = 'Download on the App Store';
        } else if (isAndroid) {
          document.getElementById('storeLink').href = 'https://play.google.com/store/apps/details?id=com.codenteam_oss.habits';
          document.getElementById('storeLink').textContent = 'Get it on Google Play';
        } else {
          document.getElementById('storeLink').href = 'https://codenteam.com/intersect/habits/downloads.html';
          document.getElementById('storeLink').textContent = 'Download Cortex';
        }
      }

      if (isDesktop) {
        // Desktop: custom scheme redirect. Show fallback after 2s if app not installed.
        document.getElementById('msg').textContent = 'Opening the desktop app...';

        // Try to open the custom scheme
        window.location.href = deepLink;

        setTimeout(function () {
          // If we're still here, the app didn't open
          showFallback("Couldn't open the app automatically.");
          document.getElementById('statusMsg').textContent = 'If Cortex is installed, click the button above.';
        }, 2000);

      } else {
        // Mobile: universal/app links should have already intercepted this URL.
        // If we're here, app isn't installed. Try custom scheme anyway.
        document.getElementById('msg').textContent = 'Opening the app...';

        window.location.href = deepLink;

        setTimeout(function () {
          showFallback("Cortex doesn't seem to be installed.");
        }, 2000);
      }

      // Hidden dev shortcut: Ctrl+D reveals the dev build fallback.
      var devFallback = document.getElementById('devFallback');
      document.addEventListener('keydown', function (e) {
        if (e.key !== 'd' && e.key !== 'D') return;
        if (!e.ctrlKey) return;
        e.preventDefault();
        devFallback.style.display = 'flex';
        document.getElementById('devOpenBtn').href = devDeepLink;
      });
    })();
  </script>
</body>
</html>
