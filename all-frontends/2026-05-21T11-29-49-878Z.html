<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World Habit</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .glass-card {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(59, 130, 246, 0.25);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }
    .btn-primary {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      transition: all 0.2s ease;
    }
    .btn-primary:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(59, 130, 246, 0.4);
    }
    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .input-field:focus {
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
      outline: none;
    }
    .reveal {
      animation: reveal 0.4s ease-out;
    }
    @keyframes reveal {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .spinner {
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="flex items-center justify-center p-4">
  <div class="glass-card rounded-2xl p-8 max-w-md w-full">
    <!-- Header -->
    <div class="text-center mb-8">
      <div class="inline-block text-5xl mb-3">👋</div>
      <h1 class="text-3xl font-bold bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent">
        Hello World
      </h1>
      <p class="text-slate-400 mt-2 text-sm">
        A simple greeting habit
      </p>
    </div>

    <!-- Hint -->
    <div class="bg-blue-500/10 border border-blue-500/30 rounded-xl p-3 mb-6">
      <p class="text-slate-300 text-sm text-center">
        Try <code class="bg-blue-500/20 px-2 py-0.5 rounded text-cyan-300 font-mono text-xs">"hello"</code>
        and <code class="bg-blue-500/20 px-2 py-0.5 rounded text-cyan-300 font-mono text-xs">"world"</code>
      </p>
    </div>

    <!-- Input fields -->
    <div class="mb-4">
      <label for="param1" class="block text-slate-300 text-sm mb-2 font-medium">
        First Word
      </label>
      <input type="text" id="param1" value="hello"
        class="input-field w-full px-4 py-3 bg-slate-800/60 border border-slate-600/50 rounded-xl text-white placeholder-slate-500 font-mono transition">
    </div>

    <div class="mb-6">
      <label for="param2" class="block text-slate-300 text-sm mb-2 font-medium">
        Second Word
      </label>
      <input type="text" id="param2" value="world"
        class="input-field w-full px-4 py-3 bg-slate-800/60 border border-slate-600/50 rounded-xl text-white placeholder-slate-500 font-mono transition">
    </div>

    <!-- Submit -->
    <button id="runBtn" onclick="runWorkflow()"
      class="btn-primary w-full text-white font-semibold py-3.5 px-6 rounded-xl">
      <span id="btnText" class="flex items-center justify-center gap-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
        </svg>
        Run Habit
      </span>
    </button>

    <!-- Status -->
    <div id="status" class="mt-5 p-3 rounded-xl text-sm text-center hidden"></div>

    <!-- Result -->
    <div id="result" class="mt-5 hidden">
      <div class="bg-gradient-to-br from-slate-800/80 to-slate-800/40 border border-slate-600/30 rounded-xl p-6 text-center">
        <p class="text-slate-400 text-xs uppercase tracking-widest mb-2">Greeting</p>
        <div id="resultMessage" class="text-2xl font-bold bg-gradient-to-r from-cyan-400 to-blue-400 bg-clip-text text-transparent"></div>
      </div>
    </div>
  </div>

  <script>
    async function runWorkflow() {
      const btn = document.getElementById('runBtn');
      const btnText = document.getElementById('btnText');
      const status = document.getElementById('status');
      const result = document.getElementById('result');
      const resultMessage = document.getElementById('resultMessage');

      const param1 = document.getElementById('param1').value;
      const param2 = document.getElementById('param2').value;

      btn.disabled = true;
      btnText.innerHTML = '<svg class="w-5 h-5 spinner" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg> Running...';

      status.className = 'mt-5 p-3 rounded-xl text-sm text-center block bg-slate-800/60 border border-slate-600/30 text-slate-300';
      status.textContent = 'Executing...';
      result.className = 'mt-5 hidden';

      try {
        const response = await fetch('/api/hello-world', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ param1, param2 })
        });

        const data = await response.json();

        if (response.ok) {
          status.className = 'mt-5 p-3 rounded-xl text-sm text-center block bg-emerald-500/10 border border-emerald-500/30 text-emerald-300';
          status.textContent = '✓ Completed successfully!';

          result.className = 'mt-5 block reveal';
          const output = data.output || {};
          const greeting = output.greeting?.value ?? output.greeting ?? JSON.stringify(output);
          resultMessage.textContent = greeting;
        } else {
          throw new Error(data.message || 'Request failed');
        }
      } catch (error) {
        status.className = 'mt-5 p-3 rounded-xl text-sm text-center block bg-red-500/10 border border-red-500/30 text-red-300';
        status.textContent = '✗ ' + error.message;
      } finally {
        btn.disabled = false;
        btnText.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg> Run Habit';
      }
    }
  </script>
</body>
</html>
