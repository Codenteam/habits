<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gym Tracker</title>
  <style>
    :root {
      --ha-bg-base: #0f172a;
      --ha-bg-surface: #1e293b;
      --ha-bg-elevated: #1a2540;
      --ha-bg-hover: #334155;
      --ha-border: #334155;
      --ha-text-primary: #ffffff;
      --ha-text-body: #cbd5e1;
      --ha-text-muted: #94a3b8;
      --ha-accent-blue: #3b82f6;
      --ha-accent-blue-hover: #2563eb;
      --ha-accent-emerald: #34d399;
      --ha-accent-emerald-dim: rgba(52,211,153,0.12);
      --ha-accent-orange: #fb923c;
      --ha-accent-orange-dim: rgba(251,146,60,0.12);
      --ha-accent-purple: #c084fc;
      --ha-accent-purple-dim: rgba(192,132,252,0.12);
      --ha-status-success: #4ade80;
      --ha-status-error: #f87171;
      --ha-status-error-dim: rgba(248,113,113,0.12);
      --ha-radius-md: 8px;
      --ha-radius-lg: 14px;
      --ha-radius-xl: 20px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--ha-bg-base);
      color: var(--ha-text-primary);
      min-height: 100vh;
    }

    /* ── Layout ── */
    .app { display: flex; min-height: 100vh; }

    .sidebar {
      width: 240px;
      background: var(--ha-bg-surface);
      border-right: 1px solid var(--ha-border);
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }

    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 8px 24px;
      border-bottom: 1px solid var(--ha-border);
      margin-bottom: 12px;
    }

    .sidebar-logo .icon { font-size: 28px; }
    .sidebar-logo h2 { font-size: 1.1rem; font-weight: 700; }
    .sidebar-logo span { font-size: 0.7rem; color: var(--ha-text-muted); display: block; }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: var(--ha-radius-md);
      cursor: pointer;
      color: var(--ha-text-muted);
      font-size: 0.9rem;
      font-weight: 500;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      transition: all 0.15s;
    }

    .nav-item:hover { background: var(--ha-bg-hover); color: var(--ha-text-primary); }
    .nav-item.active { background: var(--ha-accent-emerald-dim); color: var(--ha-accent-emerald); }

    .main { flex: 1; overflow-y: auto; }

    .topbar {
      padding: 20px 32px;
      border-bottom: 1px solid var(--ha-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--ha-bg-surface);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .topbar h1 { font-size: 1.3rem; font-weight: 700; }
    .topbar p { color: var(--ha-text-muted); font-size: 0.85rem; margin-top: 2px; }

    .today-badge {
      background: var(--ha-accent-emerald-dim);
      color: var(--ha-accent-emerald);
      border: 1px solid rgba(52,211,153,0.3);
      padding: 6px 14px;
      border-radius: 99px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .content { padding: 32px; }

    /* ── Tab pages ── */
    .page { display: none; }
    .page.active { display: block; }

    /* ── Stats row ── */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: var(--ha-bg-surface);
      border: 1px solid var(--ha-border);
      border-radius: var(--ha-radius-lg);
      padding: 20px;
    }

    .stat-card .label { font-size: 0.78rem; color: var(--ha-text-muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; }
    .stat-card .value { font-size: 2rem; font-weight: 700; }
    .stat-card .sub { font-size: 0.78rem; color: var(--ha-text-muted); margin-top: 4px; }
    .stat-card.green .value { color: var(--ha-accent-emerald); }
    .stat-card.orange .value { color: var(--ha-accent-orange); }
    .stat-card.purple .value { color: var(--ha-accent-purple); }
    .stat-card.blue .value { color: #60a5fa; }

    /* ── Card ── */
    .card {
      background: var(--ha-bg-surface);
      border: 1px solid var(--ha-border);
      border-radius: var(--ha-radius-xl);
      padding: 28px;
      margin-bottom: 24px;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ── Forms ── */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .form-grid.full { grid-template-columns: 1fr; }

    .field { display: flex; flex-direction: column; gap: 6px; }
    .field.span-2 { grid-column: span 2; }

    label { font-size: 0.82rem; font-weight: 600; color: var(--ha-text-body); }

    input, select, textarea {
      background: var(--ha-bg-elevated);
      border: 1px solid var(--ha-border);
      border-radius: var(--ha-radius-md);
      color: var(--ha-text-primary);
      padding: 10px 12px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.15s;
      width: 100%;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--ha-accent-blue);
    }

    textarea { resize: vertical; min-height: 80px; }

    select option { background: var(--ha-bg-surface); }

    /* ── Exercise builder ── */
    .exercise-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }

    .exercise-row {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr auto;
      gap: 10px;
      align-items: center;
      background: var(--ha-bg-elevated);
      border: 1px solid var(--ha-border);
      border-radius: var(--ha-radius-md);
      padding: 10px 14px;
    }

    .exercise-row input { background: transparent; border: none; padding: 4px 0; border-bottom: 1px solid var(--ha-border); border-radius: 0; }
    .exercise-row input:focus { border-bottom-color: var(--ha-accent-blue); }

    .ex-label { font-size: 0.72rem; color: var(--ha-text-muted); margin-bottom: 2px; }

    .btn-remove {
      background: var(--ha-status-error-dim);
      color: var(--ha-status-error);
      border: none;
      border-radius: 6px;
      width: 28px; height: 28px;
      cursor: pointer;
      font-size: 1rem;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
    }
    .btn-remove:hover { background: rgba(248,113,113,0.25); }

    .btn-add-exercise {
      background: none;
      border: 1px dashed var(--ha-border);
      border-radius: var(--ha-radius-md);
      color: var(--ha-text-muted);
      padding: 10px;
      cursor: pointer;
      font-size: 0.85rem;
      width: 100%;
      transition: all 0.15s;
    }
    .btn-add-exercise:hover { border-color: var(--ha-accent-blue); color: var(--ha-accent-blue); }

    /* ── Buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 22px;
      border-radius: var(--ha-radius-md);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.15s;
    }

    .btn-primary { background: var(--ha-accent-blue); color: #fff; }
    .btn-primary:hover { background: var(--ha-accent-blue-hover); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-success { background: var(--ha-accent-emerald-dim); color: var(--ha-accent-emerald); border: 1px solid rgba(52,211,153,0.3); }
    .btn-success:hover { background: rgba(52,211,153,0.2); }
    .btn-success:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-row { display: flex; gap: 12px; justify-content: flex-end; margin-top: 24px; }

    /* ── Toast ── */
    .toast-container { position: fixed; bottom: 28px; right: 28px; display: flex; flex-direction: column; gap: 10px; z-index: 1000; }

    .toast {
      background: var(--ha-bg-surface);
      border: 1px solid var(--ha-border);
      border-radius: var(--ha-radius-lg);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 280px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
      animation: slideIn 0.25s ease;
    }
    .toast.success { border-color: rgba(52,211,153,0.4); }
    .toast.error { border-color: rgba(248,113,113,0.4); }

    @keyframes slideIn { from { transform: translateX(30px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    /* ── History table ── */
    .history-table { width: 100%; border-collapse: collapse; }
    .history-table th {
      text-align: left;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--ha-text-muted);
      text-transform: uppercase;
      letter-spacing: .06em;
      padding: 0 16px 12px;
      border-bottom: 1px solid var(--ha-border);
    }
    .history-table td {
      padding: 14px 16px;
      font-size: 0.88rem;
      border-bottom: 1px solid rgba(51,65,85,0.5);
      color: var(--ha-text-body);
      vertical-align: top;
    }
    .history-table tr:last-child td { border-bottom: none; }
    .history-table tr:hover td { background: rgba(255,255,255,0.02); }

    .muscle-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 99px;
      font-size: 0.75rem;
      font-weight: 600;
      background: var(--ha-accent-purple-dim);
      color: var(--ha-accent-purple);
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--ha-text-muted);
    }
    .empty-state .icon { font-size: 3rem; margin-bottom: 12px; }
    .empty-state h3 { font-size: 1rem; margin-bottom: 6px; color: var(--ha-text-body); }

    /* ── AI Analysis ── */
    .ai-output {
      background: var(--ha-bg-elevated);
      border: 1px solid var(--ha-border);
      border-radius: var(--ha-radius-lg);
      padding: 20px;
      margin-top: 20px;
    }

    .ai-section { margin-bottom: 20px; }
    .ai-section h4 { font-size: 0.85rem; color: var(--ha-text-muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 10px; }

    .alert-item {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 10px 14px;
      border-radius: var(--ha-radius-md);
      margin-bottom: 8px;
      font-size: 0.88rem;
    }
    .alert-item.warning { background: var(--ha-accent-orange-dim); color: var(--ha-accent-orange); border: 1px solid rgba(251,146,60,0.25); }
    .alert-item.tip { background: var(--ha-accent-emerald-dim); color: var(--ha-accent-emerald); border: 1px solid rgba(52,211,153,0.25); }
    .alert-item.critical { background: var(--ha-status-error-dim); color: var(--ha-status-error); border: 1px solid rgba(248,113,113,0.25); }

    .strength-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid rgba(51,65,85,0.5);
      font-size: 0.88rem;
    }
    .strength-row:last-child { border-bottom: none; }
    .improvement-pill {
      background: var(--ha-accent-emerald-dim);
      color: var(--ha-accent-emerald);
      padding: 3px 10px;
      border-radius: 99px;
      font-size: 0.78rem;
      font-weight: 600;
    }

    .plan-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 8px; }
    .plan-item { background: var(--ha-bg-surface); border: 1px solid var(--ha-border); border-radius: var(--ha-radius-md); padding: 14px; text-align: center; }
    .plan-item .big { font-size: 1.8rem; font-weight: 700; color: var(--ha-accent-blue); }
    .plan-item .lbl { font-size: 0.75rem; color: var(--ha-text-muted); margin-top: 4px; }

    .priority-item {
      display: flex;
      gap: 12px;
      padding: 12px;
      background: var(--ha-bg-surface);
      border: 1px solid var(--ha-border);
      border-radius: var(--ha-radius-md);
      margin-bottom: 8px;
    }
    .priority-badge { padding: 3px 10px; border-radius: 99px; font-size: 0.72rem; font-weight: 700; white-space: nowrap; height: fit-content; }
    .priority-badge.High { background: var(--ha-status-error-dim); color: var(--ha-status-error); }
    .priority-badge.Medium { background: var(--ha-accent-orange-dim); color: var(--ha-accent-orange); }
    .priority-badge.Low { background: var(--ha-accent-emerald-dim); color: var(--ha-accent-emerald); }

    .coach-tip-box {
      background: linear-gradient(135deg, rgba(59,130,246,0.1), rgba(52,211,153,0.08));
      border: 1px solid rgba(59,130,246,0.3);
      border-radius: var(--ha-radius-lg);
      padding: 20px;
      margin-top: 20px;
    }
    .coach-tip-box h4 { font-size: 0.82rem; color: #60a5fa; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 8px; }
    .coach-tip-box p { font-size: 0.92rem; line-height: 1.6; color: var(--ha-text-body); }

    /* ── Spinner ── */
    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Consistency bar ── */
    .consistency-bar { height: 8px; background: var(--ha-border); border-radius: 99px; overflow: hidden; margin-top: 8px; }
    .consistency-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--ha-accent-blue), var(--ha-accent-emerald)); transition: width 0.8s ease; }

    @media (max-width: 768px) {
      .sidebar { display: none; }
      .form-grid { grid-template-columns: 1fr; }
      .field.span-2 { grid-column: span 1; }
      .exercise-row { grid-template-columns: 1fr 1fr; }
      .plan-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div class="app">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <span class="icon">🏋️</span>
      <div>
        <h2>Gym Tracker</h2>
        <span>AI-powered progress</span>
      </div>
    </div>
    <button class="nav-item active" onclick="showPage('log', this)">📝 &nbsp; Log Workout</button>
    <button class="nav-item" onclick="showPage('history', this)">📋 &nbsp; History</button>
    <button class="nav-item" onclick="showPage('analyze', this)">🤖 &nbsp; AI Analysis</button>
  </aside>

  <!-- Main -->
  <main class="main">
    <div class="topbar">
      <div>
        <h1 id="page-title">Log Workout</h1>
        <p id="page-subtitle">Record today's gym session</p>
      </div>
      <span class="today-badge" id="today-badge"></span>
    </div>

    <div class="content">

      <!-- ══════════════════════ LOG PAGE ══════════════════════ -->
      <div class="page active" id="page-log">

        <div class="card">
          <div class="card-title">💪 Session Details</div>
          <form id="log-form">
            <div class="form-grid">
              <div class="field">
                <label for="inp-date">Workout Date</label>
                <input type="date" id="inp-date" required />
              </div>
              <div class="field">
                <label for="inp-muscle">Muscle Group</label>
                <select id="inp-muscle" required>
                  <option value="">Select...</option>
                  <option value="chest">Chest</option>
                  <option value="back">Back</option>
                  <option value="legs">Legs</option>
                  <option value="shoulders">Shoulders</option>
                  <option value="arms">Arms</option>
                  <option value="core">Core</option>
                  <option value="full_body">Full Body</option>
                  <option value="cardio">Cardio</option>
                </select>
              </div>
              <div class="field">
                <label for="inp-duration">Duration (minutes)</label>
                <input type="number" id="inp-duration" min="1" max="300" placeholder="60" required />
              </div>
              <div class="field">
                <label for="inp-bodyweight">Bodyweight (kg)</label>
                <input type="number" id="inp-bodyweight" min="30" max="300" step="0.1" placeholder="Optional" />
              </div>
              <div class="field">
                <label for="inp-energy">Energy Level (1–10)</label>
                <input type="number" id="inp-energy" min="1" max="10" placeholder="7" />
              </div>
              <div class="field">
                <label for="inp-notes">Notes</label>
                <input type="text" id="inp-notes" placeholder="PRs, sleep quality, injuries..." />
              </div>
            </div>

            <!-- Exercise Builder -->
            <div style="margin-top: 24px;">
              <div class="card-title" style="margin-bottom: 14px;">🏃 Exercises</div>
              <div class="exercise-list" id="exercise-list"></div>
              <button type="button" class="btn-add-exercise" onclick="addExercise()">+ Add Exercise</button>
            </div>

            <div class="btn-row">
              <button type="submit" class="btn btn-primary" id="btn-log">
                Save Workout
              </button>
            </div>
          </form>
        </div>

        <!-- Coach tip result -->
        <div id="log-result" style="display:none;"></div>
      </div>

      <!-- ══════════════════════ HISTORY PAGE ══════════════════════ -->
      <div class="page" id="page-history">
        <div class="stats-row" id="history-stats" style="display:none;">
          <div class="stat-card green">
            <div class="label">Total Sessions</div>
            <div class="value" id="stat-total">—</div>
          </div>
          <div class="stat-card orange">
            <div class="label">Last Workout</div>
            <div class="value" id="stat-last">—</div>
            <div class="sub" id="stat-last-muscle"></div>
          </div>
          <div class="stat-card purple">
            <div class="label">Most Trained</div>
            <div class="value" id="stat-muscle">—</div>
          </div>
        </div>

        <div class="card">
          <div class="card-title" style="justify-content: space-between;">
            <span>📋 Workout History</span>
            <div style="display:flex; gap:10px; align-items:center;">
              <select id="history-filter" style="width:160px; padding:7px 10px; font-size:0.82rem;" onchange="loadHistory()">
                <option value="">All muscle groups</option>
                <option value="chest">Chest</option>
                <option value="back">Back</option>
                <option value="legs">Legs</option>
                <option value="shoulders">Shoulders</option>
                <option value="arms">Arms</option>
                <option value="core">Core</option>
                <option value="full_body">Full Body</option>
                <option value="cardio">Cardio</option>
              </select>
              <button class="btn btn-primary" onclick="loadHistory()" style="padding:8px 16px; font-size:0.82rem;">Refresh</button>
            </div>
          </div>
          <div id="history-body">
            <div class="empty-state">
              <div class="icon">📋</div>
              <h3>No sessions loaded yet</h3>
              <p>Click Refresh to load your workout history.</p>
            </div>
          </div>
        </div>
      </div>

      <!-- ══════════════════════ ANALYZE PAGE ══════════════════════ -->
      <div class="page" id="page-analyze">
        <div class="card">
          <div class="card-title">🤖 AI Progress Analysis</div>
          <div class="form-grid">
            <div class="field">
              <label for="ana-goal">Fitness Goal</label>
              <select id="ana-goal">
                <option value="general_fitness">General Fitness</option>
                <option value="muscle_gain">Muscle Gain (Hypertrophy)</option>
                <option value="strength">Strength</option>
                <option value="fat_loss">Fat Loss</option>
                <option value="endurance">Endurance</option>
              </select>
            </div>
            <div class="field">
              <label for="ana-limit">Sessions to Analyze</label>
              <input type="number" id="ana-limit" value="30" min="5" max="100" />
            </div>
          </div>
          <div class="btn-row">
            <button class="btn btn-success" id="btn-analyze" onclick="runAnalysis()">
              ✨ &nbsp; Analyze My Progress
            </button>
          </div>
        </div>

        <div id="analyze-result" style="display:none;"></div>
      </div>

    </div><!-- /content -->
  </main>
</div>

<!-- Toast container -->
<div class="toast-container" id="toasts"></div>

<script>
  /* ─────────────────────── State ─────────────────────── */
  const API = '';   // same origin
  let exerciseCount = 0;

  /* ─────────────────────── Init ─────────────────────── */
  document.addEventListener('DOMContentLoaded', () => {
    // Set today's date
    const today = new Date();
    document.getElementById('inp-date').value = today.toISOString().split('T')[0];
    document.getElementById('today-badge').textContent = today.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });

    // Pre-add one exercise row
    addExercise();

    // Form submit
    document.getElementById('log-form').addEventListener('submit', logWorkout);
  });

  /* ─────────────────────── Navigation ─────────────────────── */
  const pageTitles = {
    log: ['Log Workout', 'Record today\'s gym session'],
    history: ['Workout History', 'Browse your past sessions'],
    analyze: ['AI Analysis', 'Deep dive into your progress'],
  };

  function showPage(name, btn) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.getElementById('page-' + name).classList.add('active');
    btn.classList.add('active');
    document.getElementById('page-title').textContent = pageTitles[name][0];
    document.getElementById('page-subtitle').textContent = pageTitles[name][1];

    if (name === 'history') loadHistory();
  }

  /* ─────────────────────── Exercise Builder ─────────────────────── */
  function addExercise() {
    exerciseCount++;
    const id = exerciseCount;
    const list = document.getElementById('exercise-list');
    const row = document.createElement('div');
    row.className = 'exercise-row';
    row.id = 'ex-' + id;
    row.innerHTML = `
      <div>
        <div class="ex-label">Exercise Name</div>
        <input type="text" placeholder="e.g. Bench Press" id="ex-name-${id}" />
      </div>
      <div>
        <div class="ex-label">Sets</div>
        <input type="number" placeholder="4" id="ex-sets-${id}" min="1" />
      </div>
      <div>
        <div class="ex-label">Reps</div>
        <input type="number" placeholder="10" id="ex-reps-${id}" min="1" />
      </div>
      <div>
        <div class="ex-label">Weight (kg)</div>
        <input type="number" placeholder="80" id="ex-weight-${id}" min="0" step="0.5" />
      </div>
      <button type="button" class="btn-remove" onclick="removeExercise(${id})" title="Remove">✕</button>
    `;
    list.appendChild(row);
  }

  function removeExercise(id) {
    const el = document.getElementById('ex-' + id);
    if (el) el.remove();
  }

  function collectExercises() {
    const rows = document.querySelectorAll('.exercise-row');
    const list = [];
    rows.forEach((row) => {
      const id = row.id.replace('ex-', '');
      const name = document.getElementById('ex-name-' + id)?.value.trim();
      if (!name) return;
      list.push({
        name,
        sets: parseInt(document.getElementById('ex-sets-' + id)?.value) || 0,
        reps: parseInt(document.getElementById('ex-reps-' + id)?.value) || 0,
        weight_kg: parseFloat(document.getElementById('ex-weight-' + id)?.value) || 0,
      });
    });
    return list;
  }

  /* ─────────────────────── Log Workout ─────────────────────── */
  async function logWorkout(e) {
    e.preventDefault();
    const exercises = collectExercises();
    if (!exercises.length) { showToast('Add at least one exercise.', 'error'); return; }

    const payload = {
      date: document.getElementById('inp-date').value,
      muscle_group: document.getElementById('inp-muscle').value,
      exercises,
      duration_minutes: parseInt(document.getElementById('inp-duration').value),
      bodyweight_kg: parseFloat(document.getElementById('inp-bodyweight').value) || null,
      energy_level: parseInt(document.getElementById('inp-energy').value) || null,
      notes: document.getElementById('inp-notes').value || null,
    };

    const btn = document.getElementById('btn-log');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Saving...';

    try {
      const res = await callWorkflow('log-workout', payload);
      document.getElementById('log-result').style.display = 'block';
      document.getElementById('log-result').innerHTML = `
        <div class="card">
          <div class="card-title" style="color: var(--ha-accent-emerald);">✅ Workout Saved!</div>
          <p style="color:var(--ha-text-muted); font-size:0.82rem; margin-bottom:4px;">ID: ${res.workout_id || 'N/A'} &nbsp;·&nbsp; ${res.saved_at ? new Date(res.saved_at).toLocaleString() : ''}</p>
          ${res.coach_tip ? `<div class="coach-tip-box"><h4>🏋️ Coach Tip</h4><p>${res.coach_tip}</p></div>` : ''}
        </div>
      `;
      showToast('Workout logged successfully!', 'success');
      // Reset form
      document.getElementById('exercise-list').innerHTML = '';
      exerciseCount = 0;
      addExercise();
      document.getElementById('inp-notes').value = '';
      document.getElementById('inp-energy').value = '';
      document.getElementById('inp-bodyweight').value = '';
    } catch (err) {
      showToast('Failed to save: ' + err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.innerHTML = 'Save Workout';
    }
  }

  /* ─────────────────────── History ─────────────────────── */
  async function loadHistory() {
    const body = document.getElementById('history-body');
    body.innerHTML = '<div style="text-align:center; padding:40px; color:var(--ha-text-muted);"><span class="spinner" style="width:24px;height:24px;border-width:3px;"></span></div>';

    try {
      const res = await callWorkflow('view-history', { limit: 50 });
      const workouts = res.workouts || [];

      document.getElementById('history-stats').style.display = 'grid';
      document.getElementById('stat-total').textContent = res.total_sessions ?? workouts.length;

      if (workouts.length > 0) {
        const sorted = [...workouts].sort((a, b) => new Date(b.date) - new Date(a.date));
        const last = sorted[0];
        document.getElementById('stat-last').textContent = last.date ? new Date(last.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '—';
        document.getElementById('stat-last-muscle').textContent = last.muscle_group || '';

        // Count most trained
        const counts = {};
        workouts.forEach(w => { counts[w.muscle_group] = (counts[w.muscle_group] || 0) + 1; });
        const topMuscle = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
        document.getElementById('stat-muscle').textContent = topMuscle ? capitalize(topMuscle[0]) : '—';
      }

      const filter = document.getElementById('history-filter').value;
      const filtered = filter ? workouts.filter(w => w.muscle_group === filter) : workouts;

      if (!filtered.length) {
        body.innerHTML = '<div class="empty-state"><div class="icon">🏋️</div><h3>No sessions found</h3><p>Log your first workout to see history here.</p></div>';
        return;
      }

      const sorted = [...filtered].sort((a, b) => new Date(b.date) - new Date(a.date));

      body.innerHTML = `
        <table class="history-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Muscle Group</th>
              <th>Exercises</th>
              <th>Duration</th>
              <th>Energy</th>
              <th>Notes</th>
            </tr>
          </thead>
          <tbody>
            ${sorted.map(w => `
              <tr>
                <td>${w.date ? new Date(w.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '—'}</td>
                <td><span class="muscle-badge">${capitalize(w.muscle_group || '—')}</span></td>
                <td>${formatExercises(w.exercises)}</td>
                <td>${w.duration_minutes ? w.duration_minutes + ' min' : '—'}</td>
                <td>${w.energy_level ? w.energy_level + '/10' : '—'}</td>
                <td style="max-width:180px; color:var(--ha-text-muted);">${w.notes || ''}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    } catch (err) {
      body.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><h3>Could not load history</h3><p>${err.message}</p></div>`;
    }
  }

  function formatExercises(exercises) {
    if (!exercises || !Array.isArray(exercises) || !exercises.length) return '—';
    return exercises.slice(0, 3).map(ex => `
      <span style="display:block; font-size:0.82rem;">
        <strong style="color:var(--ha-text-primary);">${ex.name}</strong>
        <span style="color:var(--ha-text-muted);"> ${ex.sets}×${ex.reps} @ ${ex.weight_kg}kg</span>
      </span>
    `).join('') + (exercises.length > 3 ? `<span style="font-size:0.78rem; color:var(--ha-text-muted);">+${exercises.length - 3} more</span>` : '');
  }

  /* ─────────────────────── AI Analysis ─────────────────────── */
  async function runAnalysis() {
    const btn = document.getElementById('btn-analyze');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Analyzing...';
    const result = document.getElementById('analyze-result');
    result.style.display = 'none';

    try {
      const res = await callWorkflow('analyze-progress', {
        limit: parseInt(document.getElementById('ana-limit').value) || 30,
        goal: document.getElementById('ana-goal').value,
      });

      let trend = {};
      let recs = {};
      try { trend = typeof res.trend_analysis === 'string' ? JSON.parse(res.trend_analysis) : (res.trend_analysis || {}); } catch {}
      try { recs = typeof res.recommendations === 'string' ? JSON.parse(res.recommendations) : (res.recommendations || {}); } catch {}

      const summary = trend.summary || {};
      const consistency = summary.consistencyScore || 0;

      result.style.display = 'block';
      result.innerHTML = `
        <!-- Summary stats -->
        <div class="stats-row">
          <div class="stat-card green">
            <div class="label">Sessions Analyzed</div>
            <div class="value">${res.sessions_analyzed ?? '—'}</div>
          </div>
          <div class="stat-card blue">
            <div class="label">Total Hours</div>
            <div class="value">${summary.totalDurationHours ? summary.totalDurationHours.toFixed(1) : '—'}</div>
          </div>
          <div class="stat-card orange">
            <div class="label">Avg Session</div>
            <div class="value">${summary.avgSessionDuration ? Math.round(summary.avgSessionDuration) + '<small style="font-size:1rem">m</small>' : '—'}</div>
          </div>
          <div class="stat-card purple">
            <div class="label">Avg Energy</div>
            <div class="value">${summary.avgEnergyLevel ? summary.avgEnergyLevel.toFixed(1) : '—'}</div>
            <div class="sub">out of 10</div>
          </div>
        </div>

        <!-- Consistency -->
        ${summary.consistencyScore !== undefined ? `
        <div class="card">
          <div class="card-title">📊 Consistency Score</div>
          <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
            <span style="font-size:0.9rem; color:var(--ha-text-body);">${summary.consistencyLabel || ''}</span>
            <span style="font-size:1.5rem; font-weight:700; color:var(--ha-accent-emerald);">${consistency}%</span>
          </div>
          <div class="consistency-bar"><div class="consistency-fill" style="width:${consistency}%"></div></div>
          ${trend.volumeTrend ? `<p style="margin-top:14px; font-size:0.88rem; color:var(--ha-text-muted);">Volume trend: <strong style="color:var(--ha-text-primary);">${trend.volumeTrend.trend}</strong> — ${trend.volumeTrend.details}</p>` : ''}
        </div>` : ''}

        <!-- Alerts -->
        ${(trend.alerts || []).length ? `
        <div class="card">
          <div class="card-title">⚡ Alerts & Insights</div>
          <div class="ai-section">
            ${(trend.alerts || []).map(a => `<div class="alert-item ${a.type || 'tip'}">
              <span>${a.type === 'critical' ? '🚨' : a.type === 'warning' ? '⚠️' : '💡'}</span>
              <span>${a.message}</span>
            </div>`).join('')}
          </div>
        </div>` : ''}

        <!-- Strength Trends -->
        ${(trend.strengthTrend || []).length ? `
        <div class="card">
          <div class="card-title">📈 Strength Progress</div>
          ${trend.strengthTrend.map(s => `
            <div class="strength-row">
              <span>${s.exercise}</span>
              <span style="color:var(--ha-text-muted); font-size:0.82rem;">${s.startWeight}kg → ${s.currentWeight}kg</span>
              <span class="improvement-pill">+${s.improvement}</span>
            </div>
          `).join('')}
        </div>` : ''}

        <!-- Weekly Plan -->
        ${recs.weeklyPlan ? `
        <div class="card">
          <div class="card-title">📅 Recommended Weekly Plan</div>
          <div class="plan-grid">
            <div class="plan-item">
              <div class="big">${recs.weeklyPlan.recommendedSessions}</div>
              <div class="lbl">Sessions / week</div>
            </div>
            <div class="plan-item">
              <div class="big">${recs.weeklyPlan.restDays}</div>
              <div class="lbl">Rest days</div>
            </div>
            <div class="plan-item" style="grid-column: span 1;">
              <div style="font-size:0.95rem; font-weight:600; color:var(--ha-accent-purple);">${recs.weeklyPlan.suggestedSplit}</div>
              <div class="lbl">Suggested split</div>
            </div>
          </div>
          ${recs.nextWorkoutFocus ? `<p style="margin-top:16px; font-size:0.88rem; color:var(--ha-text-muted);">Next workout focus: <strong style="color:var(--ha-accent-orange);">${recs.nextWorkoutFocus}</strong></p>` : ''}
        </div>` : ''}

        <!-- Priority Actions -->
        ${(recs.priorityActions || []).length ? `
        <div class="card">
          <div class="card-title">🎯 Priority Actions</div>
          ${recs.priorityActions.map(p => `
            <div class="priority-item">
              <span class="priority-badge ${p.priority}">${p.priority}</span>
              <div>
                <div style="font-size:0.9rem; font-weight:600; margin-bottom:3px;">${p.action}</div>
                <div style="font-size:0.82rem; color:var(--ha-text-muted);">${p.reason}</div>
              </div>
            </div>
          `).join('')}
        </div>` : ''}

        <!-- Nutrition Tips -->
        ${(recs.nutritionTips || []).length ? `
        <div class="card">
          <div class="card-title">🥗 Nutrition Tips</div>
          <ul style="padding-left:18px; color:var(--ha-text-body); font-size:0.9rem; line-height:1.9;">
            ${recs.nutritionTips.map(t => `<li>${t}</li>`).join('')}
          </ul>
        </div>` : ''}
      `;

      showToast('Analysis complete!', 'success');
    } catch (err) {
      result.style.display = 'block';
      result.innerHTML = `<div class="card"><div class="empty-state"><div class="icon">⚠️</div><h3>Analysis failed</h3><p>${err.message}</p></div></div>`;
      showToast('Analysis failed: ' + err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.innerHTML = '✨ &nbsp; Analyze My Progress';
    }
  }

  /* ─────────────────────── API Helper ─────────────────────── */
  async function callWorkflow(workflowId, input) {
    const res = await fetch(`${API}/api/workflows/${workflowId}/run`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ input }),
    });
    if (!res.ok) {
      const err = await res.text();
      throw new Error(err || `HTTP ${res.status}`);
    }
    return res.json();
  }

  /* ─────────────────────── Toast ─────────────────────── */
  function showToast(message, type = 'success') {
    const container = document.getElementById('toasts');
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.innerHTML = `<span>${type === 'success' ? '✅' : '❌'}</span><span>${message}</span>`;
    container.appendChild(toast);
    setTimeout(() => toast.remove(), 4000);
  }

  /* ─────────────────────── Utils ─────────────────────── */
  function capitalize(str) {
    if (!str) return '';
    return str.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
  }
</script>
</body>
</html>
