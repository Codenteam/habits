<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test Habit</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #1a1d27;
      border: 1px solid #2d3148;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 560px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }

    .icon {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #f1f5f9;
    }

    .subtitle {
      font-size: 13px;
      color: #64748b;
      margin-top: 2px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input[type="text"] {
      width: 100%;
      background: #0f1117;
      border: 1px solid #2d3148;
      border-radius: 10px;
      padding: 12px 16px;
      color: #e2e8f0;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: #6366f1;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    button:hover  { opacity: 0.9; }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .result-section {
      margin-top: 28px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .badge.success { background: rgba(34,197,94,0.15); color: #22c55e; }
    .badge.error   { background: rgba(239,68,68,0.15);  color: #ef4444; }

    .response-box {
      background: #0f1117;
      border: 1px solid #2d3148;
      border-radius: 10px;
      padding: 16px;
      font-size: 13px;
      font-family: "JetBrains Mono", "Fira Code", monospace;
      color: #a5b4fc;
      max-height: 320px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="icon">&#127988;</div>
      <div>
        <h1>Test Habit</h1>
        <div class="subtitle">HTTP echo request via bit-http</div>
      </div>
    </div>

    <div>
      <label for="message">Test Message</label>
      <input type="text" id="message" placeholder="hello-world" value="hello-world" />
    </div>

    <button id="run-btn" onclick="runHabit()">Run Test</button>

    <div class="result-section hidden" id="result-section">
      <div id="status-badge"></div>
      <div class="response-box" id="response-box"></div>
    </div>
  </div>

  <script>
    async function runHabit() {
      const btn = document.getElementById('run-btn');
      const message = document.getElementById('message').value.trim() || 'hello-world';
      const resultSection = document.getElementById('result-section');
      const statusBadge  = document.getElementById('status-badge');
      const responseBox  = document.getElementById('response-box');

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Running...';
      resultSection.classList.add('hidden');

      try {
        const res = await fetch('/api/workflows/test-http/run', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message }),
        });

        const data = await res.json();

        statusBadge.className = 'badge ' + (res.ok ? 'success' : 'error');
        statusBadge.textContent = res.ok ? '✓ Success' : '✗ Error';
        responseBox.textContent = JSON.stringify(data, null, 2);
        resultSection.classList.remove('hidden');
      } catch (err) {
        statusBadge.className = 'badge error';
        statusBadge.textContent = '✗ Error';
        responseBox.textContent = String(err);
        resultSection.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Run Test';
      }
    }
  </script>
</body>
</html>
