<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test Habit</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f7fa;
      color: #1a1d23;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      padding: 40px;
      width: 100%;
      max-width: 540px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }

    .icon {
      width: 44px;
      height: 44px;
      background: #eef2ff;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #1a1d23;
    }

    .subtitle {
      font-size: 13px;
      color: #6b7280;
      margin-top: 2px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
    }

    input[type="url"] {
      width: 100%;
      padding: 10px 14px;
      font-size: 14px;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s;
      color: #1a1d23;
    }

    input[type="url"]:focus {
      border-color: #6366f1;
    }

    .hint {
      font-size: 12px;
      color: #9ca3af;
      margin-top: 4px;
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:hover { background: #4f46e5; }
    button:active { transform: scale(0.98); }
    button:disabled { background: #a5b4fc; cursor: not-allowed; }

    .result {
      margin-top: 28px;
    }

    .result-title {
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 10px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 14px;
    }

    .badge.success { background: #d1fae5; color: #065f46; }
    .badge.error   { background: #fee2e2; color: #991b1b; }
    .badge.pending { background: #fef3c7; color: #92400e; }

    pre {
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 14px;
      font-size: 12px;
      line-height: 1.6;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 280px;
      overflow-y: auto;
    }

    .hidden { display: none; }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="icon">&#x1F9EA;</div>
      <div>
        <h1>Test Habit</h1>
        <p class="subtitle">Run a connectivity test against any HTTP endpoint</p>
      </div>
    </div>

    <label for="url">Test URL</label>
    <input
      type="url"
      id="url"
      value="https://httpbin.org/get"
      placeholder="https://httpbin.org/get"
    />
    <p class="hint">Leave as default to test against httpbin.org</p>

    <button id="run-btn" onclick="runTest()">Run Test</button>

    <div class="result hidden" id="result">
      <p class="result-title">Result</p>
      <div id="badge"></div>
      <pre id="output"></pre>
    </div>
  </div>

  <script>
    async function runTest() {
      const btn = document.getElementById('run-btn');
      const resultEl = document.getElementById('result');
      const badgeEl = document.getElementById('badge');
      const outputEl = document.getElementById('output');
      const url = document.getElementById('url').value.trim() || 'https://httpbin.org/get';

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Running...';
      resultEl.classList.add('hidden');

      try {
        const res = await fetch(`/api/workflows/test-habit/run`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ input: { test_url: url } }),
        });

        const data = await res.json();
        const ok = data?.output?.ok ?? data?.ok ?? res.ok;
        const status = data?.output?.status ?? data?.status ?? res.status;

        badgeEl.className = `badge ${ok ? 'success' : 'error'}`;
        badgeEl.textContent = ok ? `✓  HTTP ${status} — Success` : `✗  HTTP ${status} — Failed`;
        outputEl.textContent = JSON.stringify(data?.output?.response_body ?? data, null, 2);
      } catch (err) {
        badgeEl.className = 'badge error';
        badgeEl.textContent = '✗  Request failed';
        outputEl.textContent = String(err);
      } finally {
        resultEl.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Run Test';
      }
    }
  </script>
</body>
</html>
