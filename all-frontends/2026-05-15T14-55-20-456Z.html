<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test Habit</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f4f6fa;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 40px;
      width: 100%;
      max-width: 560px;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 6px;
    }

    .subtitle {
      color: #6b7280;
      font-size: 0.92rem;
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-size: 0.88rem;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
    }

    input[type="text"] {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.95rem;
      color: #111827;
      transition: border-color 0.2s;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #6366f1;
    }

    button {
      margin-top: 18px;
      width: 100%;
      padding: 12px;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover { background: #4f46e5; }
    button:disabled { background: #a5b4fc; cursor: not-allowed; }

    .result-section { margin-top: 28px; }

    .result-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }

    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .status-ok   { background: #d1fae5; color: #065f46; }
    .status-err  { background: #fee2e2; color: #991b1b; }
    .status-idle { background: #e5e7eb; color: #6b7280; }

    pre {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 16px;
      font-size: 0.82rem;
      overflow-x: auto;
      max-height: 320px;
      color: #1e293b;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.5);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <h1>Test Habit</h1>
    <p class="subtitle">Send a test message to the public echo API and inspect the response.</p>

    <label for="message">Test Message</label>
    <input type="text" id="message" value="hello from habits" placeholder="Enter any message..." />

    <button id="run-btn" onclick="runHabit()">Run Test</button>

    <div class="result-section" id="results" style="display:none;">
      <div class="result-label">HTTP Status</div>
      <span class="status-badge" id="status-badge"></span>

      <div class="result-label">Echo Response</div>
      <pre id="response-body"></pre>
    </div>
  </div>

  <script>
    async function runHabit() {
      const btn = document.getElementById('run-btn');
      const message = document.getElementById('message').value || 'hello from habits';

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Running...';

      try {
        const res = await fetch('/api/workflows/test-habit/run', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message })
        });

        const data = await res.json();

        const status = data?.output?.status ?? data?.status ?? '?';
        const response = data?.output?.response ?? data;

        const badge = document.getElementById('status-badge');
        badge.textContent = `${status}`;
        badge.className = 'status-badge ' + (String(status).startsWith('2') ? 'status-ok' : 'status-err');

        document.getElementById('response-body').textContent =
          JSON.stringify(response, null, 2);

        document.getElementById('results').style.display = 'block';
      } catch (err) {
        const badge = document.getElementById('status-badge');
        badge.textContent = 'Error';
        badge.className = 'status-badge status-err';
        document.getElementById('response-body').textContent = String(err);
        document.getElementById('results').style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Run Test';
      }
    }
  </script>
</body>
</html>
