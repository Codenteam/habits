version: "1.0"
name: "Sheets ↔ Airtable Sync"
description: >-
  Keep Google Sheets and Airtable in sync. Set up your columns once, then new
  rows added in either place appear in the other automatically.

workflows:
  - id: configure-fields
    path: ./habits/configure-fields.yaml
    enabled: true

  - id: get-field-config
    path: ./habits/get-field-config.yaml
    enabled: true

  - id: sync-airtable-to-sheets
    path: ./habits/sync-airtable-to-sheets.yaml
    enabled: true

  - id: sync-sheets-to-airtable
    path: ./habits/sync-sheets-to-airtable.yaml
    enabled: true

server:
  port: 13000
  host: "0.0.0.0"
  frontend: ./frontend
  openapi: true

logging:
  level: info
  outputs: [console]
  format: text
  colorize: true
