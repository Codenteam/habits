version: "1.0"
name: "RSS Social Poster"
description: >
  Polls an RSS feed on a schedule, generates platform-optimised posts for
  Twitter/X and LinkedIn using OpenAI, and automatically publishes them to
  both social networks.

workflows:
  - id: fetch-rss
    path: ./habits/fetch-rss.yaml
    enabled: true

  - id: generate-social-posts
    path: ./habits/generate-social-posts.yaml
    enabled: true

  - id: post-to-social
    path: ./habits/post-to-social.yaml
    enabled: true

server:
  port: 13000
  host: "0.0.0.0"
  openapi: true
  frontend: ./frontend

logging:
  level: info
  outputs: [console]
  format: text
  colorize: true
