# yaml-language-server: $schema=../../../schemas/ui-spec.schema.yaml
version: 1

meta:
  id: whatsapp-test
  title: WhatsApp Test
  subtitle: Send the hello_world template via WhatsApp Business API
  icon: "lucide:MessageCircle"

theme:
  preset: neural
  mode: dark

state:
  result: null

actions:
  send:
    method: POST
    endpoint: /api/send-hello
    body: {}
    responsePath: output
    onSuccess:
      set: { result: "$response" }
      toast: "Message sent!"
    onError:
      toast:
        message: "{{state.error}}"
        level: error

widgets:
  - kind: card
    title: Send Hello
    subtitle: Sends hello_world template to HABITS_WHATSAPP_PHONE from env
    children:
      - kind: button
        label: Send hello
        action: send
        loadingLabel: "Sending..."
        fullWidth: true
  - kind: result-panel
    source: state.result
    showWhen: state.result
    title: Result
    sections:
      - { kind: json-dump, source: state.result, copy: true }
