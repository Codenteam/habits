version: "1.0"
name: "Stripe Payment Reconciliation"
description: >
  Polls Stripe for successful payments every 30 seconds, logs each batch,
  reconciles each payment via email notification and QuickBooks Online recording.

workflows:
  - id: poll-stripe-payments
    path: ./habits/poll-stripe-payments.yaml
    enabled: true

  - id: process-payment
    path: ./habits/process-payment.yaml
    enabled: true

  - id: list-payments
    path: ./habits/list-payments.yaml
    enabled: true

server:
  port: 13000
  host: "0.0.0.0"
  openapi: true
  frontend: ./frontend

logging:
  level: info
  outputs: [console]
  format: text
  colorize: true
