# Showcase metadata for Urgent Message Escalation example
name: Urgent Message Escalation
type: automation
description: Detects urgent Slack messages with AI, posts structured escalations to an on-call channel, and re-escalates if nobody acknowledges within 15 minutes.

longDescription: |
  **Urgent Message Escalation** monitors incoming Slack messages, uses AI to detect urgency,
  posts structured escalations to an on-call channel, and re-escalates if nobody acknowledges
  within 15 minutes.

  ## Environment variables (`.env` / keyring on apps)

  | Variable | Purpose |
  |---|---|
  | `HABITS_OPENAI_API_KEY` | OpenAI API key for urgency analysis and acknowledgement detection |
  | `HABITS_SLACK_BOT_TOKEN` | Slack bot token (`xoxb-...`) |
  | `HABITS_SLACK_SIGNING_SECRET` | Slack app signing secret (verifies inbound Events API webhooks) |
  | `HABITS_SLACK_CHANNEL_ESCALATION` | On-call / incident channel ID for escalations |

  ## How to set up

  1. Copy `.env.example` to `.env` and fill in the variables above.
  2. For Slack app setup, scopes, event subscriptions, and webhook configuration, follow the [Slack integration guide] in documentation integrations.

tags:
