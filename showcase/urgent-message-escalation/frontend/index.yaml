# yaml-language-server: $schema=../../../schemas/ui-spec.schema.yaml
version: 1

meta:
  id: urgent-message-escalation
  title: Urgent Message Escalation
  subtitle: Slack inbound → detect urgency → escalate → re-escalate if unacked
  icon: "lucide:AlarmClock"
  documentTitle: Urgent Message Escalation

theme:
  preset: neural
  mode: dark

layout:
  type: single
  header:
    title: Urgent Message Escalation
    subtitle: Background automation for Slack
    icon: "lucide:AlarmClock"

widgets:
  - kind: hero
    icon: "lucide:Siren"
    title: This showcase runs without a UI
    subtitle: Send an urgent message in Slack — the bot classifies it, posts a structured escalation, and re-escalates if nobody acknowledges within 15 minutes.

  - kind: card
    title: Status
    children:
      - kind: badge-list
        values:
          - Listening on /webhook/v/slack
          - Cron checks pending acks every 1 minutes
        tone: success
      - kind: text
        value: Post urgent phrases like "production down" or "client waiting" in a channel where the bot is present. Escalations go to the configured on-call channel.
        muted: true

  - kind: empty-state
    icon: "lucide:MessageSquareWarning"
    title: Waiting for inbound messages
    subtitle: Configure Slack Event Subscriptions and channel IDs in .env.
