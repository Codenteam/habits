id: send-digest
name: Send Digest to Slack
description: >
  Formats each email summary individually via OpenAI (one call per email),
  then assembles all blocks into a complete Slack digest message with
  header and footer, and posts it to the configured Slack channel.

nodes:
  # Format all summaries into a Slack digest message directly (no extra OpenAI calls)
  - id: assemble
    type: action
    data:
      framework: script
      source: inline
      module: slack-assembler
      label: Assemble Slack Digest
      params:
        summariesJson: "{{digestInput.summariesJson}}"
        digestDate: "{{digestInput.digestDate}}"
        emailCount: "{{digestInput.emailCount}}"
        language: deno
        script: |
          export async function main(summariesJson, digestDate, emailCount) {
            const importanceEmoji = (i) => i === 'high' ? '📌' : i === 'medium' ? '📄' : '💤';
            const sentimentEmoji = (s) => s === 'positive' ? '😊' : s === 'neutral' ? '😐' : '😟';

            const header = '*📬 Email Digest — ' + digestDate + '*\n_' + emailCount + ' emails summarized_\n---';
            const footer = '_Powered by Habits_';

            const blocks = summariesJson.map(item => {
              const s = item.output || item;
              const lines = [
                '*' + importanceEmoji(s.importance) + ' ' + s.subject + '*',
                'From: ' + s.from,
                s.category + ' ' + sentimentEmoji(s.sentiment),
                s.summary,
              ];
              if (s.keyPoints && s.keyPoints.length > 0) {
                lines.push(s.keyPoints.map(p => '• ' + p).join('\n'));
              }
              if (s.actionRequired && s.actionItem) {
                lines.push('⚡ *Action:* ' + s.actionItem);
              }
              lines.push('---');
              return lines.join('\n');
            });

            const message = [header].concat(blocks).concat([footer]).join('\n\n');
            return { message };
          }

  - id: post-slack
    type: action
    data:
      framework: bits
      source: npm
      module: "@ha-bits/bit-slack"
      operation: sendMessage
      params:
        token: "{{habits.env.HABITS_SLACK_BOT_TOKEN}}"
        channel: "{{habits.env.HABITS_SLACK_DIGEST_CHANNEL}}"
        text: "{{assemble.result.message}}"

edges:
  - source: assemble
    target: post-slack

output:
  success: "{{post-slack.success}}"
  messageTs: "{{post-slack.timestamp}}"
  channel: "{{post-slack.channel}}"
  digestText: "{{assemble.result.message}}"
