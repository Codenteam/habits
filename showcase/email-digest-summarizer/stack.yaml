version: "1.0"
name: "Email Digest Summarizer"
description: >
  Fetches emails from Gmail via IMAP, summarizes each one with OpenAI,
  and posts a digest of all summaries to a Slack channel.

workflows:
  - id: fetch-emails
    path: ./habits/fetch-emails.yaml
    enabled: true

  - id: summarize-email
    path: ./habits/summarize-email.yaml
    enabled: true

  - id: send-digest
    path: ./habits/send-digest.yaml
    enabled: true

  - id: process-emails
    path: ./habits/process-emails.yaml
    enabled: true

  - id: email-digest
    path: ./habits/email-digest.yaml
    enabled: true

server:
  port: 13000
  host: "0.0.0.0"
  openapi: true
  frontend: ./frontend

logging:
  level: info
  outputs: [console]
  format: text
  colorize: true
