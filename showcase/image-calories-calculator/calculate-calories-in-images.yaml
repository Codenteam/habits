id: calculate-calories-in-images
name: Calculate Calories in Images
description: Analyze a food photo and estimate calories and portions

input:
  - id: imageBase64
    type: string
    required: false
    description: Base64 encoded food image
  - id: imageUrl
    type: string
    required: false
    description: URL of a food image

nodes:
  - id: analysis
    type: bits
    data:
      framework: bits
      source: npm
      module: "@ha-bits/bit-intersect"
      operation: vision_prompt
      credentials:
        intersect:
          host: "{{habits.env.HABITS_INTERSECT_HOST}}"
          apiKey: "{{habits.env.HABITS_INTERSECT_API_KEY}}"
      params:
        image: "{{habits.input.imageBase64 || habits.input.imageUrl}}"
        prompt: |
          You are a knowledgeable nutritionist. Analyze this food photo and estimate:
          - Each visible food item and approximate portion (oz, cups, pieces, or grams)
          - Calories per item and a total calorie estimate
          - Brief notes on assumptions if portions are unclear

          Be specific and practical. If unsure, give your best reasonable estimate — do not say "I don't know."

          Format as readable markdown with headings and bullet points.

  - id: store-analysis
    type: bits
    data:
      framework: bits
      source: npm
      module: "@ha-bits/bit-database"
      operation: insert
      params:
        collection: calories-diary
        document:
          analysis: "{{analysis}}"
          imageProvided: true

edges:
  - source: analysis
    target: store-analysis

output:
  analysis: "{{analysis}}"
