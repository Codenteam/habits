version: "1.0"
name: "RAG Memory Query"
description: >
  Ask questions against the rag_memory vector store — embed with OpenAI,
  search with bit-database-sql, display matches in the UI.

workflows:
  - id: rag-search
    path: ./habits/rag-search.yaml
    enabled: true

server:
  port: 13003
  host: "0.0.0.0"
  openapi: true
  frontend: ./frontend

logging:
  level: info
  outputs: [console]
  format: text
  colorize: true
