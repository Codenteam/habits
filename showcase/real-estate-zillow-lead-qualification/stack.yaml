version: "1.0"
name: "Real Estate — Zillow Lead Qualification"

description: >-
  End-to-end lead processing for property inquiries from Zillow: CRM sync,
  property enrichment, AI welcome messaging via WhatsApp, conversational
  qualification, appointment capture from lead replies, and Slack notification.

workflows:
  # Stage 1: Zillow lead webhook → HubSpot → property details → WhatsApp welcome
  - id: process-zillow-lead
    path: ./habits/process-zillow-lead.yaml
    enabled: true
    webhookTimeout: 60000

  # Stage 2: WhatsApp inbound → OpenAI route reply → HubSpot update
  - id: handle-whatsapp-reply
    path: ./habits/handle-whatsapp-reply.yaml
    enabled: true
    webhookTimeout: 60000

  # Sub-habit: AI Slack summary + post (invoked by bit-loop from handle-whatsapp-reply)
  - id: notify-slack
    path: ./habits/notify-slack.yaml
    enabled: true

server:
  port: 13000
  host: "0.0.0.0"
  openapi: true

defaults:
  webhookTimeout: 60000

logging:
  level: info
  outputs: [console]
  format: text
  colorize: true
