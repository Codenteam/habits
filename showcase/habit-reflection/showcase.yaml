name: Habit Reflection 
description: AI-powered digital wellness tool that takes raw, weekly habit check-in answers and turns them into a deep synthesis of personal growth and focus areas.

longDescription: |
  - Reflect on your habits and mental health with ease. 
  - This application captures a user's rough or unorganized weekly check-in answers, 
    filters out distractions, and uses AI to generate an organized analysis of 
    accomplishments, focus blockers (like social media scrolling), and wellness patterns, 
    concluding with an actionable synthesis summary.


