version: "1.0"
name: "Stripe Payment Email Notifier"
description: >
  Polls Stripe for successful payments every 30 seconds, logs each batch,
  and sends AI-generated payment notification emails via Gmail SMTP.

workflows:
  - id: poll-stripe-payments
    path: ./habits/poll-stripe-payments.yaml
    enabled: true

  - id: send-payment-email
    path: ./habits/send-payment-email.yaml
    enabled: true

server:
  port: 13000
  host: "0.0.0.0"
  openapi: true
  frontend: ./frontend

logging:
  level: info
  outputs: [console]
  format: text
  colorize: true

# Environment variables (set in .env):
# HABITS_STRIPE_SECRET_KEY      - Stripe secret key (sk_test_... or sk_live_...)
# HABITS_OPENAI_API_KEY         - OpenAI API key for email copy generation
# HABITS_SMTP_HOST              - smtp.gmail.com
# HABITS_SMTP_PORT              - 587
# HABITS_SMTP_USER              - Gmail address used for SMTP auth
# HABITS_SMTP_PASSWORD          - Gmail app password
# HABITS_EMAIL_FROM             - Display name + address for the From header
# HABITS_PAYMENT_NOTIFY_EMAIL   - Recipient inbox for payment notifications
