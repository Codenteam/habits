version: "1.0"
name: "Salesforce Create Contact"
description: OAuth habit that creates a Contact in Salesforce CRM

workflows:
  - id: create-contact
    path: ./habits/create-contact.yaml
    displayName: Create Contact
    enabled: true

server:
  port: 13000
  host: "0.0.0.0"
  frontend: ./frontend
  openapi: true

logging:
  level: info
  outputs: [console]
  format: text
  colorize: true
