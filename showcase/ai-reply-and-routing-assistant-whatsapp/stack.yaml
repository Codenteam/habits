version: "1.0"
name: "AI Reply and Routing Assistant (WhatsApp)"
description: >
  Listens for WhatsApp customer messages, classifies them with AI, sends an
  acknowledgement, auto-replies for low-risk questions, and forwards to the
  correct team phone number.

workflows:
  - id: analyze-message
    path: ./habits/analyze-message.yaml
    enabled: true

  - id: route-category
    path: ./habits/route-category.yaml
    enabled: true

  - id: send-acknowledgement
    path: ./habits/send-acknowledgement.yaml
    enabled: true

  - id: send-auto-reply
    path: ./habits/send-auto-reply.yaml
    enabled: true

  - id: forward-msg
    path: ./habits/forward-msg.yaml
    enabled: true

  - id: forward-with-auto-reply
    path: ./habits/forward-with-auto-reply.yaml
    enabled: true

  - id: send-whatsapp-session-aware
    path: ./habits/send-whatsapp-session-aware.yaml
    enabled: true

  - id: process-message
    path: ./habits/process-message.yaml
    enabled: true

  - id: whatsapp-routing
    path: ./habits/whatsapp-routing.yaml
    enabled: true

server:
  port: 13000
  host: "0.0.0.0"
  openapi: true
  frontend: ./frontend

logging:
  level: info
  outputs: [console]
  format: text
  colorize: true
