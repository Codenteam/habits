version: "1.0"
name: Weekly Report Email

description: >
  Scheduled workflow that reads metrics from a Google Sheet, asks OpenAI to
  draft a weekly report email, and sends it via SMTP. Runs every Monday at
  09:00 UTC.

workflows:
  - id: weekly-report-email
    path: ./habits/weekly-report-email.yaml
    enabled: true

  - id: get-latest-report
    path: ./habits/get-latest-report.yaml
    enabled: true

server:
  port: 13000
  host: "0.0.0.0"
  frontend: ./frontend

logging:
  level: info
  outputs: [console]
  format: text
  colorize: true
