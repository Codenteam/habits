id: get-analysis
name: Get Analysis
description: Get a specific resume analysis from SQL database

input:
  - id: id
    type: string
    required: true
  - id: includeAttachment
    type: boolean
    required: false
    description: Whether to include the resume image attachment (reserved)

nodes:
  - id: fetch-analysis
    type: bits
    data:
      framework: bits
      source: npm
      module: "@ha-bits/bit-database-sql"
      operation: query
      params:
        collection: "resume_analyses"
        filter:
          _id: "{{habits.input.id}}"
        limit: 1

edges: []

output:
  analysis: "{{fetch-analysis.results.0}}"
