id: post-escalation
name: Post Escalation
description: Post a structured urgent escalation message to the on-call WhatsApp number

nodes:
  - id: build-message
    type: script
    data:
      label: Build Escalation Message
      framework: script
      source: inline
      params:
        analyzed: "{{analyzedMessage.output}}"
        type: script
        language: javascript
        script: |
          async function main(analyzed) {
            const level = String(analyzed.urgencyLevel || 'high').toUpperCase();
            const text = [
              `🚨 Urgent Message Escalation (${level})`,
              '',
              `From: ${String(analyzed.contactName || analyzed.from || 'Unknown')} (${String(analyzed.from || '')})`,
              '',
              `Summary:`,
              String(analyzed.summary || ''),
              '',
              `Urgency reason: ${String(analyzed.urgencyReason || '')}`,
              '',
              `Suggested next action:`,
              String(analyzed.suggestedAction || ''),
              '',
              `Details:`,
              String(analyzed.extractedDetails || ''),
              '',
              `Original message:`,
              String(analyzed.text || ''),
              '',
              '────────────────────────────',
              'Reply to this message or react with 👍 or ✅ to acknowledge.',
            ].join('\n');
            return { escalationText: text };
          }

  - id: build-outbound
    type: script
    data:
      label: Build Outbound Payload
      framework: script
      source: inline
      params:
        recipient: "{{habits.env.HABITS_WHATSAPP_ESCALATION_PHONE}}"
        message: "{{build-message.result.escalationText}}"
        type: script
        language: javascript
        script: |
          async function main(recipient, message) {
            return {
              items: [{
                recipient: String(recipient || '').trim(),
                message: String(message || ''),
                replyToMessageId: '',
              }],
            };
          }

  - id: send
    type: action
    data:
      framework: bits
      source: npm
      module: "@ha-bits/bit-loop"
      operation: forEach
      params:
        items: "{{build-outbound.result.items}}"
        habitId: send-whatsapp-session-aware
        inputKey: spread
        collectResults: true

  - id: resolve-send-result
    type: script
    data:
      label: Resolve Send Result
      framework: script
      source: inline
      params:
        sendResults: "{{send.results}}"
        type: script
        language: javascript
        script: |
          async function main(sendResults) {
            const output = sendResults?.[0]?.output || {};
            const pick = (cold, warm) => {
              const c = cold != null && cold !== '' ? cold : null;
              const w = warm != null && warm !== '' ? warm : null;
              return c ?? w ?? '';
            };
            const pickBool = (cold, warm) => {
              if (cold === true || cold === 'true') return true;
              if (warm === true || warm === 'true') return true;
              return false;
            };
            return {
              success: pickBool(output.coldSuccess, output.warmSuccess),
              messageId: pick(output.coldMessageId, output.warmMessageId),
              lastSentAt: pick(output.coldLastSentAt, output.warmLastSentAt),
              lastTemplateSentAt: pick(output.coldLastTemplateSentAt, output.warmLastTemplateSentAt),
              templateSent: output.templateSent,
              to: output.to,
              sessionWasActive: output.sessionWasActive,
            };
          }

edges:
  - source: build-message
    target: build-outbound
  - source: build-outbound
    target: send
  - source: send
    target: resolve-send-result

output:
  senderPhone: "{{analyzedMessage.output.from}}"
  senderName: "{{analyzedMessage.output.contactName}}"
  senderWaId: "{{analyzedMessage.output.waId}}"
  sourceMessageId: "{{analyzedMessage.output.messageId}}"
  sourceMessageText: "{{analyzedMessage.output.text}}"
  sourceTimestamp: "{{analyzedMessage.output.timestamp}}"
  escalationPhone: "{{habits.env.HABITS_WHATSAPP_ESCALATION_PHONE}}"
  escalationMessageId: "{{resolve-send-result.result.messageId}}"
  templateSent: "{{resolve-send-result.result.templateSent}}"
  escalationText: "{{build-message.result.escalationText}}"
  summary: "{{analyzedMessage.output.summary}}"
  urgencyLevel: "{{analyzedMessage.output.urgencyLevel}}"
  suggestedAction: "{{analyzedMessage.output.suggestedAction}}"
  urgencyReason: "{{analyzedMessage.output.urgencyReason}}"
  extractedDetails: "{{analyzedMessage.output.extractedDetails}}"
