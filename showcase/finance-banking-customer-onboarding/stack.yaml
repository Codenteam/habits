version: "1.0"
name: "Finance Banking - Customer Onboarding"

workflows:
  - id: customer-application-onboarding
    path: ./habits/customer-application-onboarding.yaml
    enabled: true
  - id: kyc-document-collection
    path: ./habits/kyc-document-collection.yaml
    enabled: true
  - id: risk-scoring
    path: ./habits/risk-scoring.yaml
    enabled: true
  - id: account-creation
    path: ./habits/account-creation.yaml
    enabled: true
  - id: credit-check
    path: ./habits/credit-check.yaml
    enabled: true
  - id: welcome-sequence
    path: ./habits/welcome-sequence.yaml
    enabled: true
  - id: onboarding-status-tracker
    path: ./habits/onboarding-status-tracker.yaml
    enabled: true

server:
  port: 13010
  host: "0.0.0.0"
  frontend: ./frontend

logging:
  level: info
  outputs: [console]
  format: text
  colorize: true
