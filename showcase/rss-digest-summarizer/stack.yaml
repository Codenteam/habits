version: "1.0"
name: "RSS Digest Summarizer"
description: >
  Polls any RSS/Atom feed for new articles, summarizes each one with OpenAI,
  and posts a digest of all summaries to a Slack channel.

workflows:
  - id: rss-digest
    path: ./habits/rss-digest.yaml
    enabled: true

  - id: summarize-content
    path: ./habits/summarize-content.yaml
    enabled: true

  - id: send-digest
    path: ./habits/send-digest.yaml
    enabled: true

server:
  port: 13000
  host: "0.0.0.0"
  openapi: true
  frontend: ./frontend

logging:
  level: info
  outputs: [console]
  format: text
  colorize: true
