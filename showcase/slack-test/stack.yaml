version: "1.0"
name: Slack Test

description: Minimal showcase to verify @ha-bits/bit-slack sendMessage, sendBlockMessage, updateMessage, addReaction, sendWebhook, and inboundMessage trigger.

workflows:
  - id: send-message
    path: ./habits/send-message.yaml
    enabled: true

  - id: send-block-message
    path: ./habits/send-block-message.yaml
    enabled: true

  - id: update-message
    path: ./habits/update-message.yaml
    enabled: true

  - id: add-reaction
    path: ./habits/add-reaction.yaml
    enabled: true

  - id: send-webhook
    path: ./habits/send-webhook.yaml
    enabled: true

  - id: receive-message
    path: ./habits/receive-message.yaml
    enabled: true

server:
  port: 13000
  host: "0.0.0.0"
  frontend: ./frontend

logging:
  level: info
  outputs: [console]
  format: text
  colorize: true
