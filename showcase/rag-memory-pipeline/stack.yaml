version: "1.0"
name: "RAG Memory Pipeline"
description: >
  Watch a directory for new files, extract RAG chunks with OpenAI,
  embed each chunk, and store in a SQLite vector database.

workflows:
  - id: rag-ingest-folder
    path: ./habits/rag-ingest-folder.yaml
    enabled: true

  - id: rag-ingest-chunk
    path: ./habits/rag-ingest-chunk.yaml
    enabled: true

  - id: rag-list-files
    path: ./habits/rag-list-files.yaml
    enabled: true

server:
  port: 13000
  host: "0.0.0.0"
  openapi: true
  frontend: ./frontend

logging:
  level: info
  outputs: [console]
  format: text
  colorize: true
