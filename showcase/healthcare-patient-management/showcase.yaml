name: Healthcare Patient Management
description: Automate appointment reminders, discharge summaries, readmission alerts, referral coordination, and patient satisfaction surveys.

longDescription: |
  A collection of habits that cover the full patient journey: from appointment booking
  to post-discharge follow-up. Each habit operates independently and can be deployed
  individually or as a complete patient management automation suite.

  ## What It Does

  - **Appointment Reminder**: automated SMS and email reminders before each appointment
  - **Discharge Summary**: AI-assisted discharge notes delivered to patient and GP
  - **Readmission Risk Alert**: flag high-risk patients before they re-present
  - **Referral Coordination**: route specialist referrals and track acknowledgement
  - **Patient Satisfaction Survey**: send and analyse post-visit surveys automatically
  - **No-Show Follow-up**: re-engage patients who missed their appointment

industries:
  - healthcare

departments:
  - patient-management

tags:
  - healthcare
  - automation
  - scheduling
  - ai

difficulty: intermediate

featured: false

type: automation



quickDownload: false

enterprise: true
improving: true
tailored: true

habits:
  - id: appointment-reminder
    name: Appointment Reminder
    description: Send automated SMS and email reminders to patients before each scheduled appointment.
    trigger: scheduler
    bits: [email, sms, scheduler]

  - id: patient-discharge-summary
    name: Discharge Summary
    description: Generate AI-assisted discharge notes and deliver them to the patient and their GP.
    trigger: webhook
    bits: [ai, email, webhook]

  - id: readmission-risk-alert
    name: Readmission Risk Alert
    description: Flag high-risk patients before they re-present using outcome data and AI scoring.
    trigger: scheduler
    bits: [ai, scheduler, slack]

  - id: referral-coordination
    name: Referral Coordination
    description: Route specialist referrals automatically and track acknowledgement status.
    trigger: webhook
    bits: [email, webhook, http]

  - id: patient-satisfaction-survey
    name: Patient Satisfaction Survey
    description: Send post-visit surveys and automatically analyse responses with AI.
    trigger: scheduler
    bits: [email, ai, scheduler]

  - id: no-show-followup
    name: No-Show Follow-up
    description: Re-engage patients who missed their appointment with a personalised follow-up message.
    trigger: scheduler
    bits: [email, sms, scheduler]

notice:
  title: "Tailored to your systems & workflows"
  text: "Every organization runs differently. Reach out to see how Habits can be up and running in your environment, tailored to your tools, your data, and your team's specific workflows."
