id: create-webhook-subscription-item
name: Create One Shopify Webhook Subscription
description: >-
  Internal helper — registers a single Shopify webhook topic. Invoked by configure-webhooks via bit-loop.

input:
  - id: topic
    type: string
    required: true
  - id: callbackUrl
    type: string
    required: true

nodes:
  - id: subscribe
    type: action
    data:
      framework: bits
      source: npm
      module: "@ha-bits/bit-shopify"
      operation: createWebhookSubscription
      label: Create webhook subscription
      credentials:
        shopify:
          shop: "{{habits.env.HABITS_SHOPIFY_SHOP}}"
          clientId: "{{habits.env.HABITS_SHOPIFY_CLIENT_ID}}"
          clientSecret: "{{habits.env.HABITS_SHOPIFY_CLIENT_SECRET}}"
      params:
        topic: "{{item.topic}}"
        callbackUrl: "{{item.callbackUrl}}"

edges: []

output:
  result: "{{subscribe}}"
