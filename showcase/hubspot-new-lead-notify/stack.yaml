version: "1.0"
name: HubSpot New Lead Slack Notify

description: >
  Listens for new HubSpot contact webhooks, fetches contact details,
  generates a Slack notification with OpenAI, and posts it to a team channel.

workflows:
  - id: hubspot-new-contact-notify
    path: ./habits/hubspot-new-contact-notify.yaml
    enabled: true

  - id: list-hubspot-contacts
    path: ./habits/list-hubspot-contacts.yaml
    enabled: true

server:
  port: 13000
  host: "0.0.0.0"
  frontend: ./frontend

logging:
  level: info
  outputs: [console]
  format: text
  colorize: true
