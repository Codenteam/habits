<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Standup | AI Studio</title>
    <style>
        :root {
            --bg-dark: #0b0f19;
            --card-bg: #151b27;
            --accent-green: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.2);
            --text-main: #94a3b8;
            --text-white: #f8fafc;
            --input-bg: #0f172a;
            --border: #1e293b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: radial-gradient(circle at top right, #111827, var(--bg-dark));
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .standup-card {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 450px;
            padding: 40px 30px;
            border-radius: 28px;
            border: 1px solid var(--border);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin: 0;
            color: var(--text-white);
            font-weight: 700;
            background: linear-gradient(to right, #a7f3d0, #10b981);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: var(--accent-green);
            font-size: 13px;
            margin: 8px 0 25px 0;
            font-family: monospace;
        }

        .status-bar {
            background-color: #0f172a;
            padding: 12px;
            border-radius: 14px;
            font-size: 14px;
            color: var(--text-white);
            font-weight: 600;
            border: 1px solid var(--border);
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .hint-box {
            background: rgba(16, 185, 129, 0.05);
            border: 1px solid rgba(16, 185, 129, 0.15);
            padding: 15px;
            border-radius: 14px;
            font-size: 13px;
            color: #a7f3d0;
            margin-bottom: 25px;
            text-align: left;
            line-height: 1.5;
        }

        .field-label {
            display: block;
            text-align: left;
            font-size: 11px;
            color: #64748b;
            margin-bottom: 10px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        textarea {
            width: 100%;
            background-color: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            color: var(--text-white);
            font-size: 14px;
            resize: none;
            box-sizing: border-box;
            transition: 0.3s;
            margin-bottom: 25px;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent-green);
            box-shadow: 0 0 0 4px var(--accent-glow);
        }

        .execute-btn {
            background: linear-gradient(135deg, #059669, var(--accent-green));
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.3s;
        }

        .execute-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
        }

        #resultArea {
            margin-top: 30px;
            background: #0f172a;
            border-radius: 16px;
            padding: 20px;
            font-size: 14px;
            line-height: 1.6;
            border-left: 4px solid var(--accent-green);
            display: none;
            text-align: left;
            white-space: pre-wrap;
            color: #e2e8f0;
        }

        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="standup-card">
        <form id="standupForm">
            <div class="header">
                <h1>Daily Standup</h1>
                <p></p>
            </div>

            <div class="status-bar">
                <span>📅</span> Agile Standup Format
            </div>

            <div class="hint-box">
                💡 Paste your rough git commits or bullet points of your tasks below to generate a clean summary.
            </div>

            <label class="field-label">RAW GIT COMMITS / TASK LIST</label>
            <textarea id="taskInput" rows="6"
                placeholder="e.g. - fixed auth bug&#10;- worked on navbar UI&#10;- blocked by backend API deployment"></textarea>

            <button id="submitBtn" class="execute-btn">
                <span id="btnText">⚡ Generate Standup</span>
            </button>

            <div id="resultArea"></div>
        </form>
    </div>

    <script>
        document.getElementById('standupForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const rawTasks = document.getElementById('taskInput').value;
            const resultArea = document.getElementById('resultArea');
            const btn = document.getElementById('btnText');

            if (!rawTasks.trim()) {
                alert("Please type or paste the text first before pressing the button!");
                return;
            }

            btn.innerText = "Formatting Standup...";
            resultArea.style.display = "none";
            this.disabled = true;

            try {
                const response = await fetch('/api/daily-standup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tasks: rawTasks })
                });

                const data = await response.json();
                const results = data.output?.Results || data.output?.result || "Could not generate standup report.";

                if (data.output && data.output.Results) {
                    resultArea.innerHTML = data.output.Results;
                    resultArea.style.display = "block";
                }

            } catch (err) {
                resultArea.innerText = "Error connecting to server. Please ensure the workflow is running.";
                resultArea.style.display = "block";
            } finally {
                btn.disabled = false;
                btn.innerText = "Generate Standup";
            }
        });
    </script>

</body>

</html>
