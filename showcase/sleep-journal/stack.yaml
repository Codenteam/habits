version: "1.0"
name: "Sleep Journal"

workflows:
  - id: log-sleep
    path: ./habits/log-sleep.yaml
    enabled: true

  - id: get-sleep-history
    path: ./habits/get-sleep-history.yaml
    enabled: true

  - id: sleep-insights
    path: ./habits/sleep-insights.yaml
    enabled: true

server:
  port: 13000
  host: "0.0.0.0"
  frontend: ./frontend
  openapi: true

logging:
  level: info
  outputs: [console]
  format: text
  colorize: true
