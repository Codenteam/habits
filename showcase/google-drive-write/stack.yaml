version: "1.0"
name: "Google Drive Write"
description: OAuth habit that writes a file to a specific Google Drive folder

workflows:
  - id: write-file
    path: ./habits/write-file.yaml
    displayName: Write File
    enabled: true

server:
  port: 13000
  host: "0.0.0.0"
  frontend: ./frontend
  openapi: true

logging:
  level: info
  outputs: [console]
  format: text
  colorize: true
