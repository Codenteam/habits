version: "1.0"
name: "AI Reply and Routing Assistant"
description: >
  Listens for Slack messages, classifies them with AI, sends an acknowledgement,
  auto-replies for low-risk questions, and forwards to the correct team channel.

workflows:
  - id: analyze-message
    path: ./habits/analyze-message.yaml
    enabled: true

  - id: route-category
    path: ./habits/route-category.yaml
    enabled: true

  - id: send-acknowledgement
    path: ./habits/send-acknowledgement.yaml
    enabled: true

  - id: send-auto-reply
    path: ./habits/send-auto-reply.yaml
    enabled: true

  - id: forward-to-channel
    path: ./habits/forward-to-channel.yaml
    enabled: true

  - id: forward-with-auto-reply
    path: ./habits/forward-with-auto-reply.yaml
    enabled: true

  - id: process-message
    path: ./habits/process-message.yaml
    enabled: true

  - id: slack-routing
    path: ./habits/slack-routing.yaml
    enabled: true

server:
  port: 13000
  host: "0.0.0.0"
  openapi: true
  frontend: ./frontend

logging:
  level: info
  outputs: [console]
  format: text
  colorize: true
