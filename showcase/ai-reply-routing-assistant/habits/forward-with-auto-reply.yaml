id: forward-with-auto-reply
name: Forward with Auto Reply
description: Forward a low-risk inquiry to the team channel, including the auto-reply sent to the user

nodes:
  - id: forward
    type: action
    data:
      framework: bits
      source: npm
      module: "@ha-bits/bit-slack"
      operation: sendMessage
      params:
        token: "{{habits.env.HABITS_SLACK_BOT_TOKEN}}"
        channel: "{{ticket.output.targetChannel}}"
        text: |
          *New {{ticket.output.routeCategory}} inquiry* ({{ticket.output.priority}} priority) — *auto-replied*

          *From:* <@{{ticket.output.user}}>
          *Channel:* <#{{ticket.output.sourceChannel}}>

          *Risk:* {{ticket.output.riskLevel}} — {{ticket.output.riskReason}}

          *Summary:*
          {{ticket.output.summary}}

          *Auto-reply sent to user:*
          {{ticket.output.finalReply}}

          *Details:*
          {{ticket.output.extractedDetails}}

          *Original message:*
          {{ticket.output.text}}

          ────────────────────────────

edges: []

output:
  success: "{{forward.success}}"
  channel: "{{forward.channel}}"
  timestamp: "{{forward.timestamp}}"
  routeCategory: "{{ticket.output.routeCategory}}"
