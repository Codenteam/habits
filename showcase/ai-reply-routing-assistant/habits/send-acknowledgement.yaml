id: send-acknowledgement
name: Send Acknowledgement
description: Post the AI-generated receipt acknowledgement in the same Slack channel

nodes:
  - id: reply
    type: action
    data:
      framework: bits
      source: npm
      module: "@ha-bits/bit-slack"
      operation: sendMessage
      params:
        token: "{{habits.env.HABITS_SLACK_BOT_TOKEN}}"
        channel: "{{ticket.output.sourceChannel}}"
        text: "{{ticket.output.suggestedReply}}"
        threadTs: "{{ticket.output.threadTs}}"

edges: []

output:
  success: "{{reply.success}}"
  channel: "{{reply.channel}}"
  timestamp: "{{reply.timestamp}}"
