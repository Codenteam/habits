version: "1.0"
name: "WhatsApp AI Chatbot"
description: >
  RAG-powered WhatsApp chatbot: ingest company/product knowledge from documents,
  answer customer questions via vector search + OpenAI, and reply on WhatsApp.

workflows:
  - id: ingest-knowledge-item
    path: ./habits/ingest-knowledge-item.yaml
    enabled: true

  - id: ingest-knowledge-file
    path: ./habits/ingest-knowledge-file.yaml
    enabled: true

  - id: handle-customer-question
    path: ./habits/handle-customer-question.yaml
    enabled: true

  - id: whatsapp-chatbot-routing
    path: ./habits/whatsapp-chatbot-routing.yaml
    enabled: true

server:
  port: 13000
  host: "0.0.0.0"
  openapi: true
  frontend: ./frontend

logging:
  level: info
  outputs: [console]
  format: text
  colorize: true
