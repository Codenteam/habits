    path: ./habits/revenue-reconciliation.yaml
    enabled: true
  - id: tax-reporting-prep
    path: ./habits/tax-reporting-prep.yaml
    enabled: true
  - id: invoice-generation
    path: ./habits/invoice-generation.yaml
    enabled: true
  - id: expense-categorisation
