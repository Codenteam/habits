id: send-digest
name: Send Digest to Slack
description: >
  Formats each content summary individually, then assembles all blocks into
  a complete Slack digest message with header and footer, and posts it to
  the configured Slack channel.

nodes:
  # Format all summaries into a Slack digest message directly (no extra OpenAI calls)
  - id: assemble
    type: action
    data:
      framework: script
      source: inline
      module: slack-assembler
      label: Assemble Slack Digest
      params:
        summariesJson: "{{digestInput.summariesJson}}"
        digestDate: "{{digestInput.digestDate}}"
        contentCount: "{{digestInput.contentCount}}"
        language: javascript
        script: |
          export async function main(summariesJson, digestDate, contentCount) {
            const importanceEmoji = (i) => i === 'high' ? '📌' : i === 'medium' ? '📄' : '💤';
            const sentimentEmoji = (s) => s === 'positive' ? '😊' : s === 'neutral' ? '😐' : '😟';

            const header = '*📬 Content Digest — ' + digestDate + '*\n_' + contentCount + ' contents summarized_\n---';

            const blocks = (Array.isArray(summariesJson) ? summariesJson : []).map(item => {
              const s = (item && (item.output || item)) || {};
              const importance = (s.importance || 'low');
              const sentiment  = (s.sentiment  || 'neutral');
              const category   = (s.category   || 'other');
              const title      = s.title   || '(Untitled)';
              const source     = s.source  || '';
              const summary    = s.summary || '';
              const lines = [
                '*' + importanceEmoji(importance) + ' ' + title + '*',
                source ? 'Source: ' + source : null,
                s.url  ? '<' + s.url + '|View article>' : null,
                category + ' ' + sentimentEmoji(sentiment),
                summary,
              ].filter(l => l !== null);
              if (Array.isArray(s.keyPoints) && s.keyPoints.length > 0) {
                lines.push(s.keyPoints.map(p => '• ' + (p || '')).join('\n'));
              }
              if (s.actionRequired && s.actionItem) {
                lines.push('⚡ *Action:* ' + s.actionItem);
              }
              lines.push('---');
              return lines.join('\n');
            });

            const message = [header].concat(blocks).join('\n\n');
            return { message };
          }

  - id: post-slack
    type: action
    data:
      framework: bits
      source: npm
      module: "@ha-bits/bit-slack"
      operation: sendMessage
      params:
        token: "{{habits.env.HABITS_SLACK_BOT_TOKEN}}"
        channel: "{{habits.env.HABITS_SLACK_DIGEST_CHANNEL}}"
        text: "{{assemble.result.message}}"

edges:
  - source: assemble
    target: post-slack

output:
  success: "{{post-slack.success}}"
  digestText: "{{assemble.result.message}}"
