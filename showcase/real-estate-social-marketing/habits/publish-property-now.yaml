id: publish-property-now
name: Publish Property Now
description: >-
  Immediately publishes a property's Twitter and LinkedIn posts,
  then marks the record as published.

input:
  - id: propertyId
    type: string
    required: true
    label: Property ID

nodes:
  - id: get-property
    type: bits
    data:
      label: Get Property by ID
      framework: bits
      source: npm
      module: "@ha-bits/bit-database-sql"
      operation: query
      params:
        collection: rem_marketing_properties
        filter: '{"_id": "{{habits.input.propertyId}}"}'
        limit: 1

  - id: post-to-twitter
    type: bits
    data:
      label: Post to Twitter/X
      framework: bits
      source: npm
      module: "@ha-bits/bit-twitter"
      operation: tweet
      auth:
        clientId: "{{habits.env.HABITS_TWITTER_CLIENT_ID}}"
      params:
        text: "{{get-property.results[0].twitter}}"

  - id: post-to-linkedin
    type: bits
    data:
      label: Post to LinkedIn
      framework: bits
      source: npm
      module: "@ha-bits/bit-linkedin"
      operation: createPost
      auth:
        clientId: "{{habits.env.HABITS_LINKEDIN_CLIENT_ID}}"
        clientSecret: "{{habits.env.HABITS_LINKEDIN_CLIENT_SECRET}}"
      params:
        text: "{{get-property.results[0].linkedin}}"
        visibility: "PUBLIC"
        organizationId: "{{habits.env.HABITS_LINKEDIN_ORGANIZATION_ID}}"

  - id: mark-published
    type: bits
    data:
      label: Mark Property as Published
      framework: bits
      source: npm
      module: "@ha-bits/bit-database-sql"
      operation: update
      params:
        collection: rem_marketing_properties
        filter:
          _id: "{{habits.input.propertyId}}"
        update:
          status: "published"

edges:
  - source: get-property
    target: post-to-twitter
  - source: get-property
    target: post-to-linkedin
  - source: post-to-twitter
    target: mark-published
  - source: post-to-linkedin
    target: mark-published

output:
  status: "published"
  propertyId: "{{habits.input.propertyId}}"
