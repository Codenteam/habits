version: "1.0"
name: Sumsub + OpenAI Demo

description: >
  End-to-end KYC demo: create a Sumsub applicant, upload ID card and selfie from
  the UI, then refresh status with an OpenAI summary.

workflows:
  - id: start-kyc
    name: Start KYC
    path: ./habits/start-kyc.yaml
    enabled: true

  - id: submit-kyc-documents
    name: Submit KYC Documents
    path: ./habits/submit-kyc-documents.yaml
    enabled: true

  - id: refresh-kyc-status
    name: Refresh KYC Status
    path: ./habits/refresh-kyc-status.yaml
    enabled: true

  - id: kyc-status-summary
    name: KYC Status Summary (one-shot)
    path: ./habits/kyc-status-summary.yaml
    enabled: true

  - id: sumsub-kyc-webhook
    name: Sumsub KYC Webhook Handler
    path: ./habits/sumsub-kyc-webhook.yaml
    enabled: true

  - id: get-kyc-customer
    name: Get KYC Customer
    path: ./habits/get-kyc-customer.yaml
    enabled: true

server:
  port: 13042
  host: "0.0.0.0"
  frontend: ./frontend
  openapi: true

logging:
  level: info
  outputs: [console]
  format: text
  colorize: true
