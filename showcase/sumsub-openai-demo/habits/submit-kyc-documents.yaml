id: submit-kyc-documents
name: Submit KYC Documents
description: Upload ID card and selfie to Sumsub, request review, and return status.

input:
  - id: applicantId
    type: string
    required: true
  - id: country
    type: string
    required: true
  - id: idCardImage
    type: string
    required: true
    description: Base64 or data-URL from file upload
  - id: idCardMimeType
    type: string
    required: false
  - id: idCardFileName
    type: string
    required: false
  - id: selfieImage
    type: string
    required: true
  - id: selfieMimeType
    type: string
    required: false
  - id: selfieFileName
    type: string
    required: false
  - id: idDocType
    type: string
    required: false
    default: ID_CARD

nodes:
  - id: upload-id-card
    type: action
    data:
      label: Upload ID Card
      framework: bits
      source: npm
      module: "@ha-bits/bit-sumsub"
      operation: uploadIdDocument
      credentials:
        sumsub:
          appToken: "{{habits.env.HABITS_SUMSUB_APP_TOKEN}}"
          secretKey: "{{habits.env.HABITS_SUMSUB_SECRET_KEY}}"
          baseUrl: "{{habits.env.HABITS_SUMSUB_BASE_URL || 'https://api.sumsub.com'}}"
      params:
        applicantId: "{{habits.input.applicantId}}"
        country: "{{habits.input.country}}"
        contentBase64: "{{habits.input.idCardImage}}"
        mimeType: "{{habits.input.idCardMimeType}}"
        fileName: "{{habits.input.idCardFileName}}"
        idDocType: "{{habits.input.idDocType || 'ID_CARD'}}"
        idDocSubType: FRONT_SIDE

  - id: upload-selfie
    type: action
    data:
      label: Upload Selfie
      framework: bits
      source: npm
      module: "@ha-bits/bit-sumsub"
      operation: uploadSelfie
      credentials:
        sumsub:
          appToken: "{{habits.env.HABITS_SUMSUB_APP_TOKEN}}"
          secretKey: "{{habits.env.HABITS_SUMSUB_SECRET_KEY}}"
          baseUrl: "{{habits.env.HABITS_SUMSUB_BASE_URL || 'https://api.sumsub.com'}}"
      params:
        applicantId: "{{habits.input.applicantId}}"
        country: "{{habits.input.country}}"
        contentBase64: "{{habits.input.selfieImage}}"
        mimeType: "{{habits.input.selfieMimeType}}"
        fileName: "{{habits.input.selfieFileName}}"

  - id: request-check
    type: action
    data:
      label: Request Sumsub Review
      framework: bits
      source: npm
      module: "@ha-bits/bit-sumsub"
      operation: requestApplicantCheck
      credentials:
        sumsub:
          appToken: "{{habits.env.HABITS_SUMSUB_APP_TOKEN}}"
          secretKey: "{{habits.env.HABITS_SUMSUB_SECRET_KEY}}"
          baseUrl: "{{habits.env.HABITS_SUMSUB_BASE_URL || 'https://api.sumsub.com'}}"
      params:
        applicantId: "{{habits.input.applicantId}}"
        reason: Documents uploaded via Habits demo UI

  - id: get-sumsub-status
    type: action
    data:
      label: Get Sumsub Status
      framework: bits
      source: npm
      module: "@ha-bits/bit-sumsub"
      operation: getApplicantStatus
      credentials:
        sumsub:
          appToken: "{{habits.env.HABITS_SUMSUB_APP_TOKEN}}"
          secretKey: "{{habits.env.HABITS_SUMSUB_SECRET_KEY}}"
          baseUrl: "{{habits.env.HABITS_SUMSUB_BASE_URL || 'https://api.sumsub.com'}}"
      params:
        applicantId: "{{habits.input.applicantId}}"

  - id: save-submission-to-db
    type: action
    data:
      label: Save Submission Status To Database
      framework: bits
      source: npm
      module: "@ha-bits/bit-database-sql"
      operation: update
      params:
        collection: kyc_customers
        database: "{{habits.env.HABITS_KYC_DATABASE || 'showcase/sumsub-openai-demo/sumsub-kyc.db'}}"
        filter:
          applicantId: "{{habits.input.applicantId}}"
        update:
          reviewStatus: "{{get-sumsub-status.status}}"
          reviewAnswer: "{{get-sumsub-status.reviewAnswer}}"
          approved: "{{get-sumsub-status.approved}}"
          allowNextSteps: false
          blockNextSteps: false
          documentsSubmitted: true
          idImageId: "{{upload-id-card.imageId}}"
          selfieImageId: "{{upload-selfie.imageId}}"
          lastWebhookType: documents_submitted

edges:
  - source: upload-id-card
    target: upload-selfie
  - source: upload-selfie
    target: request-check
  - source: request-check
    target: get-sumsub-status
  - source: get-sumsub-status
    target: save-submission-to-db

output:
  applicantId: "{{habits.input.applicantId}}"
  idUpload:
    success: "{{upload-id-card.success}}"
    imageId: "{{upload-id-card.imageId}}"
    warnings: "{{upload-id-card.warnings}}"
    errors: "{{upload-id-card.errors}}"
  selfieUpload:
    success: "{{upload-selfie.success}}"
    imageId: "{{upload-selfie.imageId}}"
    warnings: "{{upload-selfie.warnings}}"
    errors: "{{upload-selfie.errors}}"
  reviewRequest:
    ok: "{{request-check.ok}}"
    message: "{{request-check.message}}"
  kycStatus: "{{get-sumsub-status.status}}"
  reviewAnswer: "{{get-sumsub-status.reviewAnswer}}"
  approved: "{{get-sumsub-status.approved}}"
  savedToDb: "{{save-submission-to-db.success}}"
