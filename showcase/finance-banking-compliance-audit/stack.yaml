version: "1.0"
name: "Finance Banking - Compliance Audit"

workflows:
  - id: aml-screening
    path: ./habits/aml-screening.yaml
    enabled: true
  - id: sar-filing
    path: ./habits/sar-filing.yaml
    enabled: true
  - id: audit-trail-compilation
    path: ./habits/audit-trail-compilation.yaml
    enabled: true
