version: "1.0"
name: "Test Google Sheets Polling"
description: >-
  Test @ha-bits/bit-google-sheets newRows polling trigger — detects new rows in
  a sheet range and logs them to the server console.

env:
  - name: GOOGLE_CLIENT_ID
    required: true
    description: "Google OAuth Client ID"
  - name: GOOGLE_CLIENT_SECRET
    required: true
    description: "Google OAuth Client Secret"
  - name: GOOGLE_SPREADSHEET_ID
    required: true
    description: "Spreadsheet ID from the Google Sheets URL"
  - name: GOOGLE_RANGE
    required: false
    description: "Range in A1 notation"
    default: "Sheet1!A1:Z100"

workflows:
  - id: read-range
    path: ./habits/read-range.yaml
    enabled: true

  - id: poll-new-rows
    path: ./habits/poll-new-rows.yaml
    enabled: true

server:
  port: 13000
  host: "0.0.0.0"
  openapi: true

logging:
  level: info
  outputs: [console]
  format: text
  colorize: true
