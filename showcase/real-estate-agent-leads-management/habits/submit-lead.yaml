id: submit-lead
name: Submit Lead
description: Enrich lead form data with OpenAI (no scoring), then save to HubSpot and SQL with initial score from input (default 0).
version: "1.0"

nodes:
  - id: ai-enrich
    type: action
    data:
      framework: bits
      source: npm
      module: "@ha-bits/bit-openai"
      operation: ask_chatgpt
      credentials:
        openai:
          apiKey: "{{habits.env.HABITS_OPENAI_API_KEY}}"
      params:
        model: gpt-4o-mini
        cast: 'force'
        temperature: 0.3
        maxTokens: 450
        prompt: |
          You are a real-estate lead enrichment assistant.

          Lead details:
          - First Name: {{habits.input.firstName}}
          - Last Name: {{habits.input.lastName}}
          - Email: {{habits.input.email}}
          - Company (optional): {{habits.input.company}}
          - Phone: {{habits.input.phone}}

          Return ONLY valid JSON wrapped in ```json``` code fences with this exact schema:
          ```json
          {
            "email": string,
            "firstName": string,
            "lastName": string,
            "company": string | null,
            "phone": string,
            "status": "inProgress" | "reminder" | "done",
            "reminder": string | null
          }
          ```

          Rules:
          - Keep the same person fields from the input, only normalize formatting if needed.
          - company is optional; use null when the input company is empty or missing.
          - Do not include or compute a lead score.
          - status should default to "inProgress" for a newly submitted lead unless the input strongly suggests otherwise.
          - reminder should be null for a new lead.

  - id: check-hubspot-sync
    type: action
    data:
      framework: bits
      source: npm
      module: "@ha-bits/bit-if"
      operation: branch
      params:
        mode: if
        branches:
          - value1: "{{habits.input.syncHubspot}}"
            operator: equals
            value2: true
            output: hubspot
        includeElse: true
        defaultOutput: database

  - id: hubspot-sync
    type: action
    data:
      framework: bits
      source: npm
      module: "@ha-bits/bit-hubspot"
      operation: createOrUpdate
      credentials:
        hubspot:
          accessToken: "{{habits.env.HABITS_HUBSPOT_ACCESS_TOKEN}}"
      params:
        email: "{{ai-enrich.email}}"
        firstName: "{{ai-enrich.firstName}}"
        lastName: "{{ai-enrich.lastName}}"
        company: "{{ai-enrich.company}}"
        phone: "{{ai-enrich.phone}}"
        score: 0
        status: "{{ai-enrich.status}}"
        reminder: "{{ai-enrich.reminder}}"
        lastRecord: null
        submittedAt: "{{habits.input.submittedAt || new Date().toISOString()}}"

  - id: save-lead
    type: action
    data:
      framework: bits
      source: npm
      module: "@ha-bits/bit-database-sql"
      operation: insert
      params:
        collection: real_state_agent_leads_collection
        document:
          email: "{{ai-enrich.email}}"
          firstName: "{{ai-enrich.firstName}}"
          lastName: "{{ai-enrich.lastName}}"
          company: "{{ai-enrich.company}}"
          phone: "{{ai-enrich.phone}}"
          score: 0
          status: "{{ai-enrich.status}}"
          reminder: "{{ai-enrich.reminder}}"
          lastRecord: null
          submittedAt: "{{habits.input.submittedAt || new Date().toISOString()}}"

  - id: save-lead-after-hubspot
    type: action
    data:
      framework: bits
      source: npm
      module: "@ha-bits/bit-database-sql"
      operation: insert
      params:
        collection: real_state_agent_leads_collection
        document:
          email: "{{ai-enrich.email}}"
          firstName: "{{ai-enrich.firstName}}"
          lastName: "{{ai-enrich.lastName}}"
          company: "{{ai-enrich.company}}"
          phone: "{{ai-enrich.phone}}"
          score: 0
          status: "{{ai-enrich.status}}"
          reminder: "{{ai-enrich.reminder}}"
          lastRecord: null
          submittedAt: "{{habits.input.submittedAt || new Date().toISOString()}}"

  - id: finalize-db
    type: script
    data:
      framework: script
      source: inline
      label: Build database-only response
      params:
        saveResult: "{{save-lead}}"
        enrich: "{{ai-enrich}}"
        check: "{{check-hubspot-sync}}"
        type: script
        language: javascript
        script: |
          async function main(saveResult, enrich, check) {
            const submittedAt = saveResult.submittedAt || new Date().toISOString();
            return {
              success: true,
              routedTo: check.output,
              branchExecuted: check.executedConditionLabel,
              databaseSave: saveResult,
              leadId: saveResult.id,
              lead: {
                _id: saveResult.id,
                email: enrich.email,
                firstName: enrich.firstName,
                lastName: enrich.lastName,
                company: enrich.company,
                phone: enrich.phone,
                score: 0,
                status: enrich.status,
                reminder: enrich.reminder,
                lastRecord: null,
                submittedAt,
              },
            };
          }

  - id: finalize-hubspot
    type: script
    data:
      framework: script
      source: inline
      label: Build HubSpot response
      params:
        saveResult: "{{save-lead-after-hubspot}}"
        enrich: "{{ai-enrich}}"
        check: "{{check-hubspot-sync}}"
        type: script
        language: javascript
        script: |
          async function main(saveResult, enrich, check) {
            const submittedAt = saveResult.submittedAt || new Date().toISOString();
            return {
              success: true,
              routedTo: check.output,
              branchExecuted: check.executedConditionLabel,
              hubspotSave: saveResult,
              leadId: saveResult.id,
              lead: {
                _id: saveResult.id,
                email: enrich.email,
                firstName: enrich.firstName,
                lastName: enrich.lastName,
                company: enrich.company,
                phone: enrich.phone,
                score: 0,
                status: enrich.status,
                reminder: enrich.reminder,
                lastRecord: null,
                submittedAt,
              },
            };
          }

edges:
  - source: ai-enrich
    target: check-hubspot-sync
  - source: check-hubspot-sync
    target: hubspot-sync
    sourceHandle: branch-0
  - source: check-hubspot-sync
    target: save-lead-after-hubspot
    sourceHandle: branch-0
  - source: hubspot-sync
    target: save-lead-after-hubspot
    optional: true
  - source: check-hubspot-sync
    target: save-lead
    sourceHandle: branch-1
  - source: save-lead
    target: finalize-db
    optional: true
  - source: check-hubspot-sync
    target: finalize-db
    sourceHandle: branch-1
    optional: true
  - source: save-lead-after-hubspot
    target: finalize-hubspot
    optional: true
  - source: check-hubspot-sync
    target: finalize-hubspot
    sourceHandle: branch-0
    optional: true

output:
  databaseBranch: "{{finalize-db}}"
  hubspotBranch: "{{finalize-hubspot}}"
