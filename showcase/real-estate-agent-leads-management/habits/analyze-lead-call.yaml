id: analyze-lead-call
name: Analyze Lead Call
description: Transcribe uploaded lead-call audio with Whisper, analyze the transcript, and store recommendations.
version: "1.0"

nodes:
  - id: load-lead
    type: action
    data:
      framework: bits
      source: npm
      module: "@ha-bits/bit-database-sql"
      operation: query
      params:
        collection: real_state_agent_leads_collection
        filter: '{"_id": "{{habits.input.leadId}}"}'
        limit: 1

  - id: transcribe-audio
    type: action
    data:
      framework: bits
      source: npm
      module: "@ha-bits/bit-openai"
      operation: transcribe
      credentials:
        openai:
          apiKey: "{{habits.env.HABITS_OPENAI_API_KEY}}"
      params:
        audio: "{{habits.input.audio}}"
        language: "{{habits.input.language}}"

  - id: analyze-call
    type: action
    data:
      framework: bits
      source: npm
      module: "@ha-bits/bit-openai"
      operation: ask_chatgpt
      credentials:
        openai:
          apiKey: "{{habits.env.HABITS_OPENAI_API_KEY}}"
      params:
        model: gpt-4o-mini
        cast: 'force'
        temperature: 0.3
        maxTokens: 1500
        prompt: |
          You are a sales call quality analyst for real-estate leads.

          Lead context:
          - Name: {{load-lead.results[0].firstName}} {{load-lead.results[0].lastName}}
          - Email: {{load-lead.results[0].email}}
          - Company: {{load-lead.results[0].company || 'Not provided'}}

          Call transcript:
          {{transcribe-audio.text}}

          Analyze the call transcript and return ONLY valid JSON wrapped in ```json``` code fences with this exact schema:
          ```json
          {
            "summary": string,
            "rating": "good" | "bad" | "neutral",
            "score": number,
            "highlights": string[],
            "recommendations": string[],
            "hasReminder": boolean,
            "reminderDate": string | null,
            "reminderReason": string | null
          }
          ```

          Rules:
          - score must be between 0 and 100
          - summary max 3 sentences
          - Set hasReminder=true when the call mentions a follow-up, callback, or scheduled check-in; otherwise false
          - reminderDate: when hasReminder=true, copy the follow-up timing exactly as stated in the call — keep the original wording whether specific ("March 15 at 2pm") or vague ("next week", "next Tuesday", "in a few days"); do not convert to ISO dates or normalize the phrasing; null when hasReminder=false
          - reminderReason: short explanation of why to follow up; null when hasReminder=false

  - id: save-analysis
    type: action
    data:
      framework: bits
      source: npm
      module: "@ha-bits/bit-database-sql"
      operation: update
      params:
        collection: real_state_agent_leads_collection
        filter:
          _id: "{{habits.input.leadId}}"
        update:
          callAnalysis: "{{analyze-call}}"
          analysisRating: "{{analyze-call.rating}}"
          analysisScore: "{{analyze-call.score}}"
          reminderSuggestedDate: "{{analyze-call.reminderDate}}"
          reminderReason: "{{analyze-call.reminderReason}}"
          lastRecord: "{{habits.input.lastRecord}}"
          updatedAt: "{{habits.function.now()}}"

  - id: check-hubspot-sync
    type: action
    data:
      framework: bits
      source: npm
      module: "@ha-bits/bit-if"
      operation: branch
      params:
        mode: if
        branches:
          - value1: "{{habits.input.syncHubspot}}"
            operator: equals
            value2: true
            output: hubspot
        includeElse: true
        defaultOutput: database

  - id: sync-hubspot
    type: action
    data:
      framework: bits
      source: npm
      module: "@ha-bits/bit-hubspot"
      operation: createOrUpdate
      credentials:
        hubspot:
          accessToken: "{{habits.env.HABITS_HUBSPOT_ACCESS_TOKEN}}"
      params:
        email: "{{load-lead.results[0].email}}"
        firstName: "{{load-lead.results[0].firstName}}"
        lastName: "{{load-lead.results[0].lastName}}"
        company: "{{load-lead.results[0].company}}"
        phone: "{{load-lead.results[0].phone}}"
        score: "{{load-lead.results[0].score}}"
        status: "{{load-lead.results[0].status}}"
        reminder: "{{load-lead.results[0].reminder}}"
        lastRecord: "{{habits.input.lastRecord}}"

edges:
  - source: load-lead
    target: transcribe-audio
  - source: transcribe-audio
    target: analyze-call
  - source: analyze-call
    target: save-analysis
  - source: save-analysis
    target: check-hubspot-sync
  - source: check-hubspot-sync
    target: sync-hubspot
    sourceHandle: branch-0

output:
  success: true
  leadId: "{{habits.input.leadId}}"
  routedTo: "{{check-hubspot-sync.output}}"
  branchExecuted: "{{check-hubspot-sync.executedConditionLabel}}"
  transcript: "{{transcribe-audio.text}}"
  analysis: "{{analyze-call}}"
  lastRecord: "{{habits.input.lastRecord}}"
